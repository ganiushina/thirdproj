<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Маржинальная прибыль</title>
    <!-- Add Bootstrap CSS for tabs and tables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <div class="row mb-3">
        <div class="col-md-3">
            <label for="date1" class="form-label">Date From:</label>
            <input type="date" id="date1" class="form-control" th:value="${param.date1}">
        </div>
        <div class="col-md-3">
            <label for="date2" class="form-label">Date To:</label>
            <input type="date" id="date2" class="form-control" th:value="${param.date2}">
        </div>
        <div class="col-md-2 align-self-end">
            <button class="btn btn-primary" onclick="loadTabContent('home')">Apply Filter</button>
        </div>
    </div>

    <!-- Tab Navigation -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home" aria-selected="true" onclick="loadTabContent('home')">Месяц</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab" aria-controls="profile" aria-selected="false" onclick="loadTabContent('profile')">Квартал</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="salary-tab" data-bs-toggle="tab" data-bs-target="#salary" type="button" role="tab" aria-controls="salary" aria-selected="false" onclick="loadTabContent('salary')">Выплаты</button>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
            <!-- Placeholder for Home Tab Content -->
            <div id="home-content">Loading Home Content...</div>
        </div>
        <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
            <!-- Placeholder for Profile Tab Content -->
            <div id="profile-content">Loading Profile Content...</div>
        </div>
        <div class="tab-pane fade" id="salary" role="tabpanel" aria-labelledby="salary-tab">
            <!-- Placeholder for Profile Tab Content -->
            <div id="salary-content">Loading Salary Content...</div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Datepicker JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/js/bootstrap-datepicker.min.js"></script>


<!-- JavaScript to load tab content dynamically -->
<script>
    function loadTabContent(tabName) {
       const dateFrom = document.getElementById('date1').value;
            const dateTo = document.getElementById('date2').value;
            const contentDiv = document.getElementById(`${tabName}-content`);
            contentDiv.innerHTML = "Loading...";

            // Include date filters in the request URL
            fetch(`/tabs/${tabName}?date1=${dateFrom}&date2=${dateTo}`)
                .then(response => response.text())
                .then(data => contentDiv.innerHTML = data)
                .catch(error => contentDiv.innerHTML = "Error loading data.");

                 // Load default tab content on page load
        document.addEventListener("DOMContentLoaded", () => {
            loadTabContent('home');
        });

        // Initialize datepicker (optional)
        $(document).ready(function() {
            $('#date1, #date2').datepicker({
                format: 'yyyy-mm-dd',
                autoclose: true
            });
        });

    });
</script>
</body>
</html>
