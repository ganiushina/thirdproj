<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Акты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* Общие стили */
        .navbar {
        z-index: 1030; /* Выше чем у заголовков таблиц */
        }

        /* Контейнер для контента под навигацией */
        .main-content {
        position: relative;
        padding-top: 56px; /* Высота навигации */
        }

        /* Контейнер таблицы с фиксированным заголовком */
        .table-container {
        position: relative;
        height: calc(100vh - 180px); /* Подстройте высоту */
        overflow-y: auto;
        }

        /* Стиль для фиксированных заголовков */
        .fixed-header thead th {
        position: sticky;
        top: 56px; /* Высота навигации */
        background: white;
        z-index: 1020; /* Ниже навигации */
        box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        /* Остальные ваши стили */
        .paid-true { background-color: #e8f5e9 !important; }
        .paid-false { background-color: #ffebee !important; }
        td { vertical-align: middle; padding: 0.5rem !important; }
        tr:hover td { background-color: #f8f9fa !important; }

        .stats-block {
            background-color: transparent;
            padding: 0;
            margin-bottom: 20px;
            border-radius: 0;
            border: none;
        }

        .stats-block .col-md-4 {
            padding-left: 5px;
            padding-right: 5px;
        }

        .stats-block .bg-light {
            background-color: #f8f9fa !important;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            height: 100%;
        }

        .stats-block p {
            margin-bottom: 0.5rem;
            padding: 0.3rem 0.5rem;
            background-color: white;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        .table-width-limiter {
            max-width: 100%;
            padding-left: 15px;
            padding-right: 15px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<div th:replace="~{navigation :: navi(Home)}" />

<!-- Основной контейнер с отступами по бокам -->
<div class="main-content">
<div class="container-fluid mt-4 px-3">
    <div class="row justify-content-center">
        <div class="col-12 table-width-limiter">
            <h2>Акты</h2>

            <!-- Фильтр по датам -->
            <form id="dateFilterForm" class="mb-4">
                <div class="row">
                    <div class="col-md-3">
                        <label for="dateFrom" class="form-label">От:</label>
                        <input type="date" class="form-control" id="dateFrom" name="dateFrom"
                               th:value="${dateFrom != null} ? ${#temporals.format(dateFrom, 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-3">
                        <label for="dateTo" class="form-label">До:</label>
                        <input type="date" class="form-control" id="dateTo" name="dateTo"
                               th:value="${dateTo != null} ? ${#temporals.format(dateTo, 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-2 align-self-end">
                        <button type="button" class="btn btn-primary" onclick="loadActiveTab()">Применить</button>
                    </div>
                </div>
            </form>
            <div class="stats-block row mx-0" th:if="${allActMoney != null}">
                <div class="col-md-4 px-2">
                    <div class="bg-light p-2 rounded border">
                        <p class="mb-1" th:text="'Всего неоплачено актов: ' + ${allActMoney}"></p>
                        <p class="mb-0" th:text="'Всего выставлено актов: ' + ${allActForClientMoneyPeriod}"></p>
                    </div>
                </div>
                <div class="col-md-4 px-2">
                    <div class="bg-light p-2 rounded border">
                        <p class="mb-1" th:text="'Неоплачено за период: ' + ${allActMoneyPeriod}"></p>
                        <p class="mb-0" th:text="'Оплачено за период: ' + ${allActMoneyPeriodPaid}"></p>
                    </div>
                </div>
                <div class="col-md-4 px-2">
                    <div class="bg-light p-2 rounded border">
                        <p class="mb-1" th:text="'По компаниям: ' + ${allActForClientMoneyPeriodByCompanyString}"></p>
                        <p class="mb-0" th:text="'Ожидается выходов: ' + ${allFinalistMoneyPeriodPaid}"></p>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/act-filter-fragment :: filter-form}"></div>

            <!-- Навигация по вкладкам -->
            <ul class="nav nav-tabs" id="reportTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="actPeriod-tab" data-bs-toggle="tab"
                            data-bs-target="#actPeriod" type="button" role="tab"
                            aria-controls="actPeriod" aria-selected="true"
                            onclick="loadTabContent('/acts/actAll', 'actPeriodTab')">
                        Акты за период
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="actUnpaid-tab" data-bs-toggle="tab"
                            data-bs-target="#actUnpaid" type="button" role="tab"
                            aria-controls="actUnpaid" aria-selected="false"

                        Неоплаченные акты

                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="actExpected-tab" data-bs-toggle="tab"

                        Детализация по Клиентам

                    <div class="tab-pane fade" id="actExpected" role="tabpanel">

                    </div>

        </div>
    </div>
</div>

     // Функция загрузки активной вкладки
     function loadActiveTab() {
         const activeTab = document.querySelector('#reportTabs .nav-link.active');
         if (activeTab) {
             const tabId = activeTab.id;
             const tabMap = {
                 'actPeriod-tab': ['/acts/actAll', 'actPeriodTab'],
                 'actUnpaid-tab': ['/acts/unpaidActs', 'actUnpaidTab'],
                 'actExpected-tab': ['/acts/expectedExits', 'actExpectedTab'],
                 'actByDepartment-tab': ['/acts/departmentActs', 'actByDepartmentTab']
             };

             if (tabMap[tabId]) {
                 loadTabContent(...tabMap[tabId]);
             }
         }
     }

     // Функция загрузки контента вкладки
     function loadTabContent(url, fragment) {
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const companyFilter = document.getElementById('globalCompanySearch').value; // Получаем значение из поля ввода

        // Создаем параметры запроса
        let params = new URLSearchParams();
        params.append('dateFrom', dateFrom);
        params.append('dateTo', dateTo);

        // Добавляем фильтр компании, если он есть
        if (companyFilter && companyFilter.trim() !== '') {
            params.append('companyFilter', companyFilter);
        }

        // Загружаем сначала основную страницу с обновлённой статистикой
        fetch(`/acts?${params.toString()}`)
            .then(response => response.text())
            .then(html => {
                // Обновляем только статистический блок
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newStats = doc.querySelector('.stats-block');
                if (newStats) {
                    const currentStats = document.querySelector('.stats-block');
                    if (currentStats) {
                        currentStats.innerHTML = newStats.innerHTML;
                    }
                }

                // Затем загружаем содержимое вкладки
                return fetch(`${url}?${params.toString()}`);
            })
            .then(response => response.text())
            .then(html => {
                const targetDiv = {
                    'actPeriodTab': 'actPeriodContent',
                    'actUnpaidTab': 'actUnpaidContent',
                    'actExpectedTab': 'actExpectedContent',
                    'actByDepartmentTab': 'actByDepartmentContent'
                }[fragment];

                if (targetDiv) {
                    document.getElementById(targetDiv).innerHTML = html;
                    initTableFeatures();
                    adjustStickyHeaders();
                    applyFilters();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const targetDiv = {
                    'actPeriodTab': 'actPeriodContent',
                    'actUnpaidTab': 'actUnpaidContent',
                    'actExpectedTab': 'actExpectedContent',
                    'actByDepartmentTab': 'actByDepartmentContent'
                }[fragment];
                if (targetDiv) {
                    document.getElementById(targetDiv).innerHTML =
                        '<div class="alert alert-danger">Ошибка загрузки данных</div>';
                }
            });
    }

        function applyFilters() {
            // 1. Обновляем текущие значения фильтров
            currentFilters.actNum = document.getElementById('globalActNumSearch').value.toLowerCase();
            currentFilters.candidate = document.getElementById('globalCandidateSearch').value.toLowerCase();
            currentFilters.project = document.getElementById('globalProjectSearch').value.toLowerCase();
            currentFilters.company = document.getElementById('globalCompanySearch').value.toLowerCase();
            currentFilters.department = document.getElementById('globalDepartmentSearch').value.toLowerCase();
            currentFilters.filterByCreationDate = document.getElementById('filterByCreationDate').checked;
            currentFilters.paymentStatus = document.getElementById('paymentStatus').value;

            // 2. Получаем даты из фильтров
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            // 3. Определяем активную вкладку
            const activeTab = document.querySelector('#reportTabs .nav-link.active');
            if (!activeTab) return;

            // 4. Если это вкладка "Детализация по Клиентам" и изменился фильтр компании
            if (activeTab.id === 'actByDepartment-tab' && currentFilters.company) {
                // Формируем параметры запроса только с companyFilter
                let params = new URLSearchParams();
                params.append('dateFrom', dateFrom);
                params.append('dateTo', dateTo);
                params.append('companyFilter', currentFilters.company);

                // 5. Определяем target div для обновления
                const targetDiv = 'actByDepartmentContent';
                const container = document.getElementById(targetDiv);

                // 6. Показываем индикатор загрузки
                container.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';

                // 7. Отправляем запрос на сервер только с фильтром компании
                fetch(`/acts/departmentActs?${params.toString()}`)
                    .then(response => response.text())
                    .then(html => {
                        container.innerHTML = html;
                        initTableFeatures();
                        adjustStickyHeaders();

                        // Применяем остальные фильтры на клиенте
                        applyClientSideFilters();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        container.innerHTML = '<div class="alert alert-danger">Ошибка загрузки данных</div>';
                    });
            } else {
                // Для всех других вкладок или если не фильтр компании - применяем только клиентскую фильтрацию
                applyClientSideFilters();
            }

            // Функция для применения фильтров на клиенте
            function applyClientSideFilters() {
                const table = document.querySelector('.tab-pane.active table');
                if (!table) return;

                const rows = table.querySelectorAll('tbody tr');
                const headers = table.querySelectorAll('thead th');

                const columnIndexes = {
                    actNum: findColumnIndex(headers, ['номер акта']),
                    candidate: findColumnIndex(headers, ['кандидат']),
                    project: findColumnIndex(headers, ['проект']),
                    company: findColumnIndex(headers, ['компания', 'организация']),
                    department: findColumnIndex(headers, ['направление']),
                    actDate: findColumnIndex(headers, ['дата акта']),
                    paymentStatus: findColumnIndex(headers, ['оплата', 'статус оплаты'])
                };

                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');

                    // Проверка текстовых фильтров
                    const actNumText = columnIndexes.actNum !== -1 ? cells[columnIndexes.actNum]?.textContent.toLowerCase() : '';
                    const candidateText = columnIndexes.candidate !== -1 ? cells[columnIndexes.candidate]?.textContent.toLowerCase() : '';
                    const projectText = columnIndexes.project !== -1 ? cells[columnIndexes.project]?.textContent.toLowerCase() : '';
                    const companyText = columnIndexes.company !== -1 ? cells[columnIndexes.company]?.textContent.toLowerCase() : '';
                    const departmentText = columnIndexes.department !== -1 ? cells[columnIndexes.department]?.textContent.toLowerCase() : '';

                    // Проверка фильтра по дате создания
                    let dateMatch = true;
                    if (currentFilters.filterByCreationDate && columnIndexes.actDate !== -1) {
                        const dateText = cells[columnIndexes.actDate]?.textContent.trim();
                        const actDate = parseTableDate(dateText);
                        dateMatch = isDateInPeriod(actDate, dateFrom, dateTo);
                    }

                    // Проверка фильтра по оплате
                    let paymentMatch = true;
                    if (currentFilters.paymentStatus !== 'all' && columnIndexes.paymentStatus !== -1) {
                        const isPaid = cells[columnIndexes.paymentStatus]?.textContent.toLowerCase().includes('да');
                        paymentMatch = (currentFilters.paymentStatus === 'paid' && isPaid) ||
                                      (currentFilters.paymentStatus === 'unpaid' && !isPaid);
                    }

                    // Комбинированная проверка всех фильтров
                    const matches = [
                        !currentFilters.actNum || actNumText.includes(currentFilters.actNum),
                        !currentFilters.candidate || candidateText.includes(currentFilters.candidate),
                        !currentFilters.project || projectText.includes(currentFilters.project),
                        !currentFilters.company || companyText.includes(currentFilters.company),
                        !currentFilters.department || departmentText.includes(currentFilters.department),
                        dateMatch,
                        paymentMatch
                    ].every(Boolean);

                    row.style.display = matches ? '' : 'none';
                });
            }
        }

    // Вспомогательная функция для проверки даты в периоде
    function isDateInPeriod(date, dateFrom, dateTo) {
        if (!date) return false;
        const from = dateFrom ? new Date(dateFrom) : null;
        const to = dateTo ? new Date(dateTo) : null;
        if (to) to.setHours(23, 59, 59); // Учитываем весь день

        return (!from || date >= from) && (!to || date <= to);
    }


    // Поиск индекса столбца по ключевым словам
    function findColumnIndex(headers, keywords) {
        for (let i = 0; i < headers.length; i++) {
            const headerText = headers[i].textContent.toLowerCase();
            if (keywords.some(keyword => headerText.includes(keyword))) {
                return i;
            }
        }
        return -1;
    }

    // Инициализация фильтров
    function initFilters() {
        // Текстовые фильтры
        document.getElementById('globalActNumSearch').addEventListener('input', function() {
            currentFilters.actNum = this.value.toLowerCase();
            applyFilters();
        });

        document.getElementById('globalCandidateSearch').addEventListener('input', function() {
            currentFilters.candidate = this.value.toLowerCase();
            applyFilters();
        });

        document.getElementById('globalProjectSearch').addEventListener('input', function() {
            currentFilters.project = this.value.toLowerCase();
            applyFilters();
        });

        document.getElementById('globalCompanySearch').addEventListener('input', function() {
            currentFilters.company = this.value.toLowerCase();
            applyFilters();
        });

        // Фильтр по дате создания
        document.getElementById('filterByCreationDate').addEventListener('change', function() {
            currentFilters.filterByCreationDate = this.checked;
            applyFilters();
        });
        // Добавляем новый обработчик для фильтра по направлению
        document.getElementById('globalDepartmentSearch').addEventListener('input', function() {
            currentFilters.department = this.value.toLowerCase();
            applyFilters();
        });

        // Фильтр по оплате
        document.getElementById('filterByPayment').addEventListener('change', function() {
            const enabled = this.checked;
            document.getElementById('paymentStatus').disabled = !enabled;
            if (!enabled) {
                currentFilters.paymentStatus = 'all';
            }
            applyFilters();
        });

        document.getElementById('paymentStatus').addEventListener('change', function() {
            currentFilters.paymentStatus = this.value;
            applyFilters();
        });

        // При изменении дат тоже применяем фильтры
        document.getElementById('dateFrom').addEventListener('change', applyFilters);
        document.getElementById('dateTo').addEventListener('change', applyFilters);
    }


     // Инициализация функций таблицы
     function initTableFeatures() {
         initTableSorting();
         applyPaidRowStyles();
         adjustStickyHeaders();
     }

     function adjustStickyHeaders() {
         // Вычисляем общую высоту всех фиксированных элементов над таблицей
         const navbarHeight = document.querySelector('.navbar').offsetHeight;
         const filterHeight = document.querySelector('#dateFilterForm').offsetHeight;
         const tabsHeight = document.querySelector('#reportTabs').offsetHeight;

         const totalOffset = navbarHeight + filterHeight + tabsHeight;

         // Применяем вычисленное значение ко всем заголовкам таблиц
         document.querySelectorAll('.sticky-header-table thead th').forEach(th => {
             th.style.top = totalOffset + 'px';
         });
     }

     // Сортировка таблицы
     function initTableSorting() {
         document.querySelectorAll('.sortable').forEach(table => {
             const headers = table.querySelectorAll('thead th');

             headers.forEach((header, columnIndex) => {
                 header.addEventListener('click', () => {
                     const direction = header.classList.contains('sorted-asc') ? 'desc' : 'asc';

                     headers.forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
                     header.classList.add(`sorted-${direction}`);

                     const rows = Array.from(table.querySelectorAll('tbody tr'));
                     rows.sort((a, b) => {
                         const aVal = a.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                         const bVal = b.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                         return compareValues(aVal, bVal, direction);
                     });

                     const tbody = table.querySelector('tbody');
                     rows.forEach(row => tbody.appendChild(row));
                 });
             });
         });
     }

     // Сравнение значений для сортировки
     function compareValues(a, b, direction) {
         const aNum = parseFloat(a?.replace(/[^\d.,]/g, '').replace(',', '.'));
         const bNum = parseFloat(b?.replace(/[^\d.,]/g, '').replace(',', '.'));

         if (!isNaN(aNum) && !isNaN(bNum)) {
             return direction === 'asc' ? aNum - bNum : bNum - aNum;
         }
         return direction === 'asc' ? a.localeCompare(b) : b.localeCompare(a);
     }

     function applyPaidRowStyles() {
         document.querySelectorAll('#periodTable tbody tr').forEach(row => {
             const paidCell = row.querySelector('td:nth-child(8)');
             if (paidCell) {
                 row.classList.remove('paid-true', 'paid-false');
                 row.classList.add(paidCell.textContent.trim() === 'Да' ? 'paid-true' : 'paid-false');
             }
         });
     }


      function exportFilteredActsToExcel() {
         // 1. Получаем выбранный период
         const dateFromInput = document.getElementById('dateFrom').value;
         const dateToInput = document.getElementById('dateTo').value;

         const wb = XLSX.utils.book_new();
         let ws; // Объявляем переменную здесь, чтобы она была доступна во всей функции

         const dateFrom = dateFromInput ? new Date(dateFromInput) : null;
         const dateTo = dateToInput ? new Date(dateToInput) : null;
         if (dateTo) dateTo.setHours(23, 59, 59);

         // 2. Находим активную таблицу
         const table = document.querySelector('.tab-pane.active table');
         if (!table) {
             alert('Таблица не найдена');
             return;
         }

         const tableId = table.id;

         // 3. Обработка periodTable с фильтрацией по дате
         if (tableId === 'periodTable') {
             const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
             const dateColumnIndex = headers.findIndex(h => h === 'Дата акта');

             if (dateColumnIndex === -1) {
                 alert('Колонка "Дата акта" не найдена');
                 return;
             }

             // Собираем данные с фильтрацией по дате
             const data = [];
             const rows = table.querySelectorAll('tbody tr:not([style*="display: none"])');

             rows.forEach(row => {
                 const dateCell = row.querySelector(`td:nth-child(${dateColumnIndex + 1})`);
                 if (!dateCell) return;

                 const dateText = dateCell.textContent.trim();
                 const actDate = parseTableDate(dateText);

                 if ((!dateFrom || actDate >= dateFrom) && (!dateTo || actDate <= dateTo)) {
                     const rowData = {};
                     row.querySelectorAll('td').forEach((cell, i) => {
                         const header = headers[i];
                         if (header) {
                             rowData[header] = formatCellValue(cell, header);
                         }
                     });
                     data.push(rowData);
                 }
             });

             if (data.length === 0) {
                 alert('Нет данных для экспорта в выбранном периоде');
                 return;
             }

             ws = XLSX.utils.json_to_sheet(data);

             // Форматирование числовых колонок
             headers.forEach((header, colIndex) => {
                 if (['Сумма', 'Бонус', 'Сумма бонуса'].includes(header)) {
                     for (let rowIndex = 1; rowIndex <= data.length; rowIndex++) {
                         const cell = XLSX.utils.encode_cell({r: rowIndex, c: colIndex});
                         if (ws[cell]) {
                             ws[cell].t = 'n';
                             ws[cell].z = '#,##0.00';
                         }
                     }
                 }
             });
         }
         // 4. Обработка остальных таблиц
         else {
             const numericCols = table.dataset.numericCols?.split(',') || [];
             ws = XLSX.utils.table_to_sheet(table);

             const range = XLSX.utils.decode_range(ws['!ref']);
             for (let C = range.s.c; C <= range.e.c; ++C) {
                 const header = XLSX.utils.encode_col(C) + "1";
                 if (ws[header] && numericCols.includes(ws[header].v)) {
                     for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                         const cell = XLSX.utils.encode_cell({r: R, c: C});
                         if (ws[cell]) {
                             const value = ws[cell].v;
                             if (typeof value === 'string') {
                                 const num = parseFloat(value.replace(/\s+/g, '').replace(',', '.'));
                                 if (!isNaN(num)) {
                                     ws[cell].v = num;
                                     ws[cell].t = 'n';
                                     ws[cell].z = '#,##0.00';
                                 }
                             }
                         }
                     }
                 }
             }
         }

         // 5. Сохраняем файл
         XLSX.utils.book_append_sheet(wb, ws, "Акты");
         XLSX.writeFile(wb, `Акты_${dateFromInput || ''}_${dateToInput || ''}.xlsx`);
     }


         // Функция для парсинга дат из таблицы
         function parseTableDate(dateStr) {
             if (!dateStr || typeof dateStr !== 'string') return null;

             // Удаляем лишние пробелы и возможные HTML-сущности
             dateStr = dateStr.trim().replace(/&nbsp;/g, ' ');

             // 1. Формат dd.mm.yyyy (01.01.2023)
             let match = dateStr.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
             if (match) {
                 return new Date(
                     parseInt(match[3], 10),
                     parseInt(match[2], 10) - 1,
                     parseInt(match[1], 10)
                 );
             }

             // 2. Формат dd-mm-yyyy (01-01-2023)
             match = dateStr.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
             if (match) {
                 return new Date(
                     parseInt(match[3], 10),
                     parseInt(match[2], 10) - 1,
                     parseInt(match[1], 10)
                 );
             }

             // 3. Формат yyyy-mm-dd (2023-01-01)
             match = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
             if (match) {
                 return new Date(
                     parseInt(match[1], 10),
                     parseInt(match[2], 10) - 1,
                     parseInt(match[3], 10)
                 );
             }

             // 4. Формат dd/mm/yyyy (01/01/2023)
             match = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
             if (match) {
                 return new Date(
                     parseInt(match[3], 10),
                     parseInt(match[2], 10) - 1,
                     parseInt(match[1], 10)
                 );
             }

             // 5. Пробуем стандартный парсинг Date (для других форматов)
             const parsedDate = new Date(dateStr);
             if (!isNaN(parsedDate.getTime())) {
                 return parsedDate;
             }

             // 6. Попробуем разобрать дату с текстовым месяцем (01 янв 2023)
             const months = {
                 'янв': 0, 'фев': 1, 'мар': 2, 'апр': 3, 'май': 4, 'июн': 5,
                 'июл': 6, 'авг': 7, 'сен': 8, 'окт': 9, 'ноя': 10, 'дек': 11
             };

             match = dateStr.match(/^(\d{1,2})\s+([а-яa-z]{3})\s+(\d{4})$/i);
             if (match) {
                 const monthName = match[2].toLowerCase().substr(0, 3);
                 if (months.hasOwnProperty(monthName)) {
                     return new Date(
                         parseInt(match[3], 10),
                         months[monthName],
                         parseInt(match[1], 10)
                     );
                 }
             }

             console.warn(`Не удалось распознать дату: ${dateStr}`);
             return null; // или return new Date(0); если нужно вернуть минимальную дату
         }

         // Форматирование значения ячейки
         function formatCellValue(cell, header) {
             const text = cell.textContent.trim();

             // Числовые колонки
             if (['Сумма', 'Бонус', 'Сумма бонуса'].includes(header)) {
                 const num = parseFloat(text.replace(/\s+/g, '').replace(',', '.'));
                 return isNaN(num) ? 0 : num;
             }

             // Колонка с датой
             if (header === 'Дата акта') {
                 return parseTableDate(text);
             }

             // Все остальные колонки - как текст
             return text;
         }

         // Установка числовых форматов
         function setNumericFormats(ws, headers) {
             const range = XLSX.utils.decode_range(ws['!ref']);

             headers.forEach((header, colIndex) => {
                 const headerText = header.textContent.trim();

                 if (headerText === 'Сумма' || headerText === 'Бонус') {
                     for (let rowIndex = range.s.r + 1; rowIndex <= range.e.r; rowIndex++) {
                         const cell = XLSX.utils.encode_cell({r: rowIndex, c: colIndex});
                         if (ws[cell]) {
                             ws[cell].t = 'n';
                             ws[cell].z = '#,##0.00';
                         }
                     }
                 }

                 if (headerText === 'Дата акта' || headerText === 'Дата оплаты') {
                     for (let rowIndex = range.s.r + 1; rowIndex <= range.e.r; rowIndex++) {
                         const cell = XLSX.utils.encode_cell({r: rowIndex, c: colIndex});
                         if (ws[cell]) {
                             ws[cell].t = 'd';
                             ws[cell].z = 'dd.mm.yyyy';
                         }
                     }
                 }
             });
         }




     // Инициализация при загрузке страницы
     document.addEventListener('DOMContentLoaded', function() {
         initFilters();
         loadTabContent('/acts/actAll', 'actPeriodTab');
     });
</script>
