<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dynamic Tabs with AJAX</title>
    <!-- Add Bootstrap CSS for tabs and tables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <!-- Tab Navigation -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="month-tab" data-bs-toggle="tab" data-bs-target="#month" type="button" role="tab" aria-controls="month" aria-selected="true" onclick="loadTabContent('month')">Month</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="quarter-tab" data-bs-toggle="tab" data-bs-target="#quarter" type="button" role="tab" aria-controls="quarter" aria-selected="false" onclick="loadTabContent('quarter')">Quarter</button>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="month" role="tabpanel" aria-labelledby="month-tab">
            <!-- Placeholder for Home Tab Content -->
            <div id="month-content">Loading Home Content...</div>
        </div>
        <div class="tab-pane fade" id="quarter" role="tabpanel" aria-labelledby="quarter-tab">
            <!-- Placeholder for Profile Tab Content -->
            <div id="quarter-content">Loading Profile Content...</div>
        </div>
    </div>
</div>

<!-- Add Bootstrap JS for tabs -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript to load tab content dynamically -->
<script>
    function loadTabContent(tabName) {
        const contentDiv = document.getElementById(`${tabName}-content`);
        contentDiv.innerHTML = "Loading..."; // Show loading message

        // Fetch content from the server
        fetch(`/margin/${tabName}`)
            .then(response => response.text())
            .then(data => {
                contentDiv.innerHTML = data; // Insert the fetched content
            })
            .catch(error => {
                contentDiv.innerHTML = "Failed to load content."; // Show error message
                console.error(error);
            });
    }

    // Load initial content for the default tab
    document.addEventListener("DOMContentLoaded", function() {
        loadTabContent('month');
    });
</script>
</body>
</html>
