    <title>Акты</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <style>
        input:required {
            background-color: #ffdddd;
        }

        /* Фиксированная шапка таблицы */
        .table-container {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .table thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 10;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1);
        }

        /* Улучшенный внешний вид кнопки */
        .btn-primary {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Улучшенные отступы */
        .container {
            padding-top: 20px;
            padding-bottom: 20px;
        }

        /* Подсветка строк при наведении */
        .table-hover tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body>

<div th:replace="~{navigation :: navi(Shop)}"/>

<div class="container">
    <h1>Акты</h1>
    <p class="lead" th:text="'Акт для ' + ${employer.ManFIO}"></p>

    <form th:action="@{/act/allact}" method="post" id="actsForm">
        <div class="table-container">
            <table id="myTable" class="table table-hover">
                <thead>
                <tr>
                    <th>Процент</th>
                    <th>Компания</th>
                    <th>Кандидат</th>
                    <th>Сумма без НДС</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="act,iterStat : ${actList}">
                    <td>
                        <div class="d-flex align-items-center">
                            <input type="checkbox"
                                   class="mr-2"
                                   name="actIds"
                                   th:value="${act.actId}"
                                   th:checked="${act.paid} ? 'checked'" />
                            <input type="number"
                                   step="0.5"
                                   min="0"
                                   max="100"
                                   class="form-control form-control-sm"
                                   style="width: 70px;"
                                   name="percents"
                                   th:value="${act.percent != null} ? ${act.percent} : 0"/>
                        </div>
                    </td>
                    <td th:text="${act.company}"></td>
                    <td th:text="${act.candidate}"></td>
                    <td th:text="${act.totalSum}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <input type="hidden" name="fio" th:value="${employer.ManFIO}"/>
        <input type="hidden" name="request" th:value="${requestParam}"/>
        <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>

        <button type="submit" id="buttonID" class="btn btn-primary" disabled>Готово</button>
        <button type="button" class="btn btn-secondary" onclick="cancelChanges()">Отмена</button>
<!--        <button type="button" class="btn btn-secondary ml-2" onclick="cancelChanges()">Отмена</button>-->
    </form>
</div>

     let wasCancelled = false;

    document.getElementById('actsForm').addEventListener('submit', function(e) {
        e.preventDefault();

        fetch(this.action, {
            method: 'POST',
            body: new FormData(this)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success && !wasCancelled) {
                const params = new URLSearchParams(window.location.search);
                const dateFrom = params.get('dateFrom') || '';
                const dateTo = params.get('dateTo') || '';


                if (window.opener) {
                    window.opener.postMessage({
                        type: 'BONUS_DATA_UPDATED',
                        payload: {
                            fio: result.fio,
                            count: result.updatedCount,
                            dateFrom: dateFrom,
                            dateTo: dateTo
                        }
                    }, '*');
                }
                window.close();
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
        });
    });

    function cancelChanges() {
        wasCancelled = true;
        window.close();
    }

    // Остальной код обработчиков checkbox/number и кнопки
    $(document).ready(function () {
        $('input[type="number"]').change(function () {
            $(this).siblings('input[type="checkbox"]').prop('checked', true);
            checkButtonState();
        });

        $('input[type="checkbox"]').change(function () {
            checkButtonState();
        });

        function checkButtonState() {
            let hasErrors = false;
            $('input[type="number"][required]').each(function () {
                if ($(this).val() === "" || parseFloat($(this).val()) === 0) {
                    hasErrors = true;
                    return false;
                }
            });

            $("#buttonID").attr("disabled", hasErrors);
        }
    });
