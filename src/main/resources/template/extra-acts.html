<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акты</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <style>
        input:required {
            background-color: #ffdddd;
        }

        /* Фиксированная шапка таблицы */
        .table-container {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .table thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 10;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1);
        }

        /* Улучшенный внешний вид кнопки */
        .btn-primary {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Улучшенные отступы */
        .container {
            padding-top: 20px;
            padding-bottom: 20px;
        }

        /* Подсветка строк при наведении */
        .table-hover tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body>

<div th:replace="~{navigation :: navi(Shop)}"/>

<div class="container">
    <h1>Акты</h1>
    <p class="lead" th:text="'Акт для ' + ${employer.ManFIO}"></p>

    <form th:action="@{/act/allact}" th:object="${actList}" method="post">
        <div class="table-container">
            <table id="myTable" class="table table-hover">
                <thead>
                <tr>
                    <th>Процент</th>
                    <th>Компания</th>
                    <th>Кандидат</th>
                    <th>Сумма без НДС</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="act,iterStat : ${actList}">
                    <td>
                        <div class="d-flex align-items-center">
                            <input type="checkbox"
                                   class="mr-2"
                                   name="act"
                                   th:value="${act.actId}"
                                   th:checked="${act.paid} ? 'checked'" />
                            <input type="number"
                                   id="percent"
                                   step="0.5"
                                   min="0"
                                   max="100"
                                   class="form-control form-control-sm"
                                   style="width: 70px;"
                                   name="percent"
                                   th:value="${act.percent != null} ? ${act.percent}"/>
                        </div>
                    </td>
                    <td th:text="${act.company}"></td>
                    <td th:text="${act.candidate}"></td>
                    <td th:text="${act.totalSum}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <input hidden type="text" name="fio" th:value="${employer.ManFIO}"/>
        <input hidden name="actList" th:value="${actList}"/>

        <button type="submit"
                id="buttonID"
                name="request"
                th:value="${requestParam}"
                class="btn btn-primary"
                disabled>Готово</button>
    </form>
</div>

<script>
    $(document).ready(function() {
        // Обработчик изменения числового поля
        $('input[type="number"]').change(function(){
            $(this).siblings('input[type="checkbox"]').prop('checked', true);
            let thisval = $(this).val();

            if (thisval == 0) {
                $(this).siblings('input[type="checkbox"]').prop('checked', false);
                $(this).prop('required', false);
            } else {
                $(this).siblings('input[type="checkbox"]').prop('checked', true);
            }

            checkButtonState();
        });

        // Обработчик изменения чекбокса
        $('input[type="checkbox"]').change(function(){
            var checked = $(this).is(':checked');
            var input = $(this).closest('tr').find('input[type="number"]');
            var d = input.val();

            if (d == 0) {
                input.prop("required", checked);
            }

            checkButtonState();
        });

        // Функция проверки состояния кнопки
        function checkButtonState() {
            var hasErrors = false;

            // Проверяем все обязательные поля
            $('input[type="number"][required]').each(function() {
                if ($(this).val() == "" || $(this).val() == 0) {
                    hasErrors = true;
                    return false; // прерываем цикл
                }
            });

            $("#buttonID").attr("disabled", hasErrors);
        }
    });
</script>

</body>
</html>
