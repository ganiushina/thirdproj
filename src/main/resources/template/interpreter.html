<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="interpreterTab">
    <h4>Детализация выплат</h4>
    <p>Выплаты за период <span th:text="${#temporals.format(dateFrom)}">...</span> -
        <span th:text="${#temporals.format(dateTo)}">...</span></p>

    <div th:replace="~{fragments/filter-fragment_interpreters :: filter-form(tableId='interpreters')}"></div>

    <div class="sticky-table-wrapper">
        <table id="interpreters" class="table table-bordered table-sortable">
            <thead>
            <tr>
                <th>ФИО</th>
                <th>Должность</th>
                <th>Отдел</th>
                <th>Зарплата</th>
                <th>Бонус</th>
                <th>Бонус БДМ</th>
                <th>НДФЛ</th>
                <th>Бонус+НДФЛ</th>
                <th>Вся сумма</th>
                <th>Месяц</th>
                <th>Квартал</th>
                <th>Год</th>
            </tr>
            </thead>
            <tbody>
            <!-- Внешний цикл по пользователям -->
            <th:block th:each="user : ${userSalaryList}">


                <tr th:each="salary,iter : ${user.salaryList}"
                    th:data-user-fio="${user.userFio}"
                    th:data-position="${user.position}"
                    th:data-department="${user.department}"
                    th:data-month="${#strings.toLowerCase(salary.salaryMonthStr)}">


                    <!-- Объединенные ячейки (только для первой строки) -->
                    <td th:text="${user.userFio}"
                        th:if="${iter.index == 0}"
                        th:rowspan="${user.salaryList.size()}"></td>
                    <td th:text="${user.position}"
                        th:if="${iter.index == 0}"
                        th:rowspan="${user.salaryList.size()}"></td>
                    <td th:text="${user.department}"
                        th:if="${iter.index == 0}"
                        th:rowspan="${user.salaryList.size()}"></td>

                    <!-- Данные по зарплате -->
                    <td th:text="${salary.userSalaryRUB}" class="numeric"></td>
                    <td th:text="${salary.userBonusRUB}" class="numeric"></td>
                    <td th:text="${salary.userBonusBDMRUB}" class="numeric"></td>
                    <td th:text="${salary.userSalaryNDFLRUB}" class="numeric"></td>
                    <td th:text="${salary.userSalarySingleRUB}" class="numeric"></td>
                    <td th:text="${salary.userSalaryAllRUB}" class="numeric"></td>
                    <td th:text="${salary.salaryMonthStr}" class="month-cell"></td>
                    <td th:text="${salary.salaryQuarter}" class="numeric"></td>
                    <td th:text="${salary.salaryYear}" class="numeric"></td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function adjustStickyHeader() {
                const nav = document.querySelector('nav'); // Или ваш селектор навигации
                const navHeight = nav ? nav.offsetHeight : 56; // 56px - стандартная высота

                document.querySelectorAll('.sticky-table-wrapper thead th').forEach(th => {
                    th.style.top = navHeight + 'px';
                });
            }

            // Инициализация + обработка ресайза
            adjustStickyHeader();
            window.addEventListener('resize', adjustStickyHeader);

            // Для динамических изменений в навигации
            new MutationObserver(adjustStickyHeader).observe(
                document.querySelector('nav'),
                { attributes: true, attributeFilter: ['style'] }
            );
        });
    </script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Инициализация сортировки для этой таблицы
        document.addEventListener('DOMContentLoaded', function() {
            initTableSorting(); // Вызов функции из main.html
        });

        // Если таблица загружается через AJAX:
        setTimeout(initTableSorting, 50);
        /*]]>*/

        console.log('Инициализация таблицы:', table.id);
    </script>
</div>
</html>
