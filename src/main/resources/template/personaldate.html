<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Согласия на обработку персональных данных</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .navbar {
            z-index: 1030;
        }

        .main-content {
            position: relative;
            padding-top: 56px;
        }

        .table-container {
            position: relative;
            overflow-x: auto;
        }

        .fixed-header thead th {
            background-color: #f8f9fa !important;
            border-bottom: 2px solid #dee2e6;
            box-shadow: none;
        }

        td {
            vertical-align: middle;
            padding: 0.5rem !important;
        }

        tr:hover td {
            background-color: #f8f9fa !important;
        }

        .table-width-limiter {
            max-width: 100%;
            padding-left: 15px;
            padding-right: 15px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-block {
            background-color: transparent;
            padding: 0;
            margin-bottom: 20px;
            border-radius: 0;
            border: none;
        }

        .stats-block .bg-light {
            background-color: #f8f9fa !important;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            height: 100%;
        }
    </style>
</head>
<body>
<div th:replace="~{navigation :: navi('PersonalData')}"></div>

<div class="main-content">
    <div class="container-fluid mt-4 px-3">
        <div class="row justify-content-center">
            <div class="col-12 table-width-limiter">
                <h2>Статистика отправки согласий на обработку персональных данных</h2>

                <form method="get" th:action="@{/personal-data}" class="mb-4">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="date1" class="form-label">От:</label>
                            <input type="date" class="form-control" id="date1" name="date1"
                                   th:value="${date1 != null ? #temporals.format(date1, 'yyyy-MM-dd') : ''}">
                        </div>
                        <div class="col-md-3">
                            <label for="date2" class="form-label">До:</label>
                            <input type="date" class="form-control" id="date2" name="date2"
                                   th:value="${date2 != null ? #temporals.format(date2, 'yyyy-MM-dd') : ''}">
                        </div>
                        <div class="col-md-2 align-self-end">
                            <button type="submit" class="btn btn-primary">Применить</button>
                        </div>
                        <div class="col-md-3 align-self-end">
                            <button type="button" class="btn btn-success" onclick="exportPersonalDataToExcel()">
                                Выгрузить в Excel
                            </button>
                        </div>
                    </div>
                </form>

                <div class="stats-block row mx-0 mb-3" th:if="${personalDataList != null}">
                    <div class="col-md-4 px-2">
                        <div class="bg-light">
                            <p class="mb-0">
                                Период: <span th:text="${#temporals.format(date1, 'dd.MM.yyyy')}"></span>
                                -
                                <span th:text="${#temporals.format(date2, 'dd.MM.yyyy')}"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table table-bordered table-hover fixed-header">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Пользователь</th>
                            <th scope="col">Всего согласий</th>
                            <th scope="col">Подтверждено</th>
                            <th scope="col">Не подтверждено</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${personalDataList == null || personalDataList.isEmpty()}">
                            <td colspan="4" class="text-center text-muted">Нет данных за выбранный период</td>
                        </tr>
                        <tr th:each="item : ${personalDataList}">
                            <td th:text="${item.userName}"></td>
                            <td th:text="${item.cntTotal}"></td>
                            <td th:text="${item.cntConfirmed}"></td>
                            <td th:text="${item.cntNotConfirmed}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function exportPersonalDataToExcel() {
        const tableRows = document.querySelectorAll('.table-container table tbody tr');
        const data = [];

        tableRows.forEach(row => {
            const cells = row.querySelectorAll('td');
            if (cells.length !== 4) {
                return;
            }

            if (cells[0].classList.contains('text-muted')) {
                return;
            }

            data.push({
                'Пользователь': cells[0].innerText.trim(),
                'Всего согласий': cells[1].innerText.trim(),
                'Подтверждено': cells[2].innerText.trim(),
                'Не подтверждено': cells[3].innerText.trim()
            });
        });

        if (!data.length) {
            alert('Нет данных для выгрузки.');
            return;
        }

        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Согласия ПД');

        const dateFrom = document.getElementById('date1')?.value || 'from';
        const dateTo = document.getElementById('date2')?.value || 'to';
        XLSX.writeFile(workbook, `personal_data_${dateFrom}_${dateTo}.xlsx`);
    }
</script>
</body>
</html>
