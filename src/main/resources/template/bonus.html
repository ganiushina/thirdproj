<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="bonusTab">
    <style>
        .fixed-header {
            width: 100%;
            margin-bottom: 0;
            table-layout: auto;
        }

        .fixed-header thead th {
            position: sticky;
            top: 0; /* Будет переопределено JavaScript из родительской страницы */
            background: white;
            z-index: 10;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        .fixed-header td {
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            padding: 0.5rem;
        }

        /* Стиль для кнопки Excel */
        .btn-excel {
            background-color: #217346;
            color: white;
            border-color: #217346;
        }
        .btn-excel:hover {
            background-color: #1b5e38;
            border-color: #1b5e38;
            color: white;
        }
    </style>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Заработанные бонусы</h4>
        <button class="btn btn-sm btn-excel" onclick="window.exportBonusToExcel()">
            <i class="fas fa-file-excel"></i> Экспорт в Excel
        </button>
    </div>
    <table id="bonusTable" class="table table-bordered table-hover fixed-header">
        <thead class="table-light">
        <tr>
            <th>ФИО</th>
            <th>Должность</th>
            <th>Департамент</th>
            <th>Всего заработано</th>
            <th>Всего Бонус</th>
            <th>Бонус за кандидата</th>
            <th>Заработано за кандидата</th>
            <th>Имя кандидата</th>
            <th>Наименование компании</th>
            <th>Процент</th>
            <th>Месяц</th>
            <th>Год</th>
            <th>Добавить</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="userBonus : ${userBonus}">
            <!-- Строка для пользователей без деталей -->
            <tr th:if="${userBonus.userBonusDetails.empty}"
                th:attr="data-fio=${userBonus.fio.toLowerCase()}, data-department=${userBonus.department.toLowerCase()}">
                <td th:text="${userBonus.fio}"></td>
                <td th:text="${userBonus.position}"></td>
                <td th:text="${userBonus.department}"></td>
                <td th:text="${#numbers.formatDecimal(userBonus.sumTotal, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(userBonus.moneyAll, 1, 2)}"></td>
                <td colspan="8">Нет данных о бонусах</td>
            </tr>

            <!-- Строки для пользователей с деталями -->
            <tr th:each="detail, iter : ${userBonus.userBonusDetails}"
                th:attr="data-fio=${userBonus.fio.toLowerCase()}, data-department=${userBonus.department.toLowerCase()}">
                <!-- Показываем информацию о пользователе только в первой строке группы -->
                <td th:if="${iter.first}" th:text="${userBonus.fio}"
                    th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                <td th:if="${iter.first}" th:text="${userBonus.position}"
                    th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                <td th:if="${iter.first}" th:text="${userBonus.department}"
                    th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                <td th:if="${iter.first}" th:text="${#numbers.formatDecimal(userBonus.sumTotal, 1, 2)}"
                    th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                <td th:if="${iter.first}" th:text="${#numbers.formatDecimal(userBonus.moneyAll, 1, 2)}"
                    th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>

                <!-- Данные по конкретному бонусу -->
                <td th:text="${#numbers.formatDecimal(detail.moneyByCandidate, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(detail.sumUser, 1, 2)}"></td>
                <td th:text="${detail.candidateName}"></td>
                <td th:text="${detail.companyName}"></td>
                <td th:text="${#numbers.formatDecimal(detail.percent, 1, 1)} + '%'"></td>
                <td th:text="${detail.monthName}"></td>
                <td th:text="${detail.year}"></td>
                <td>
                    <span th:text="${detail.extraBonusAct}"></span>

                    <a th:with="returnPath=${'/bonus/getall?dateFrom=' + #uris.escapeQueryParam(#request.getParameter('dateFrom')) + '&dateTo=' + #uris.escapeQueryParam(#request.getParameter('dateTo'))}"
                       th:href="@{/bonus/add(
                       fio=${userBonus.fio},
                       dateFrom=${#request.getParameter('dateFrom')},
                       dateTo=${#request.getParameter('dateTo')},
                       returnUrl=${returnPath}
                   )}"
                       class="btn btn-sm btn-primary"
                       onclick="return openExtraActsByHref(this.href);">
                        Добавить
                    </a>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <script>
    </script>
</div>
</html>
