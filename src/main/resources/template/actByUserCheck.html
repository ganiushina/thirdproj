<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="actByUserTab">

    <h4>Выставленные акты по направлениям и людям</h4>
    <p>Акты за период <span th:text="${#temporals.format(dateFrom)}">...</span> -
        <span th:text="${#temporals.format(dateTo)}">...</span></p>

    <div th:replace="~{fragments/filter-fragment_acts :: filter-form}"></div>

    <div class="sticky-table-wrapper">
        <table id="actByUser" class="table table-bordered">
            <thead>
            <tr>
                <th>Номер акта</th>
                <th>Дата акта</th>
                <th>Сумма акта</th>
                <th>Компания</th>
                <th>Кандидат</th>
                <th>Выставлен от</th>
                <th>Направление</th>
                <th>Консультант</th>
                <th>Сумма консультанта</th>
                <th>Ресечер</th>
                <th>Сумма ресечера</th>
                <th>Процент участия</th>
                <th>Проект</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:if="${!groupedActs.isEmpty()}">
                <th:block th:each="entry : ${groupedActs.entrySet()}">
                    <th:block th:with="acts=${entry.value}">
                        <tr th:each="act,iter : ${acts}"
                            th:class="${iter.index == 0} ? 'act-row act-group-start' : 'act-row'"
                            th:data-act-num="${entry.key}"
                            th:data-act-date="${act.dateAct != null ? #temporals.format(act.dateAct, 'yyyy-MM-dd') : ''}"
                            th:data-company="${#strings.defaultString(act.companyName, '')}"
                            th:data-candidate="${#strings.defaultString(act.candidate, '')}"
                            th:data-organization="${#strings.defaultString(act.organization, '')}"
                            th:data-department="${#strings.defaultString(act.departmentName, '')}"
                            th:data-consultant="${#strings.defaultString(act.responsibleUserName, '')}"
                            th:data-researcher="${#strings.defaultString(act.resecherName, '')}"
                            th:data-project="${#strings.defaultString(act.projectName, '')}">
                            <!-- Объединяем ячейки только для первой строки группы -->
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${entry.key}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${#temporals.format(act.dateAct, 'dd.MM.yyyy')}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${#numbers.formatDecimal(act.totalNoNds, 1, 2)}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${act.companyName}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${act.candidate}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>
                            <td class="act-header-cell" data-header-cell="true"
                                th:text="${act.organization}"
                                th:if="${iter.index == 0}"
                                th:rowspan="${acts.size()}"></td>

                            <!-- Остальные поля для всех строк -->
                            <td th:text="${act.departmentName}"></td>
                            <td th:text="${act.responsibleUserName}"></td>
                            <td th:text="${#numbers.formatDecimal(act.summResponsibleUser, 1, 2)}"></td>
                            <td th:text="${act.resecherName}"></td>
                            <td th:text="${#numbers.formatDecimal(act.summResecher, 1, 2)}"></td>
                            <td th:text="${#numbers.formatDecimal(act.candidatePercent, 1, 2)} + '%'"></td>
                            <td th:text="${act.projectName}"></td>
                        </tr>
                    </th:block>
                </th:block>
            </th:block>

            <th:block th:if="${groupedActs.isEmpty()}">
                <tr class="no-data-row">
                    <td colspan="13" class="text-center text-muted">
                        Нет данных для отображения за выбранный период
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>
</html>
