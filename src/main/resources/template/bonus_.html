<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="bonusTab">
    <style>
        .table-scroll-container {
            height: calc(100vh - 350px);
            overflow-y: auto;
            position: relative;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .fixed-header {
            width: 100%;
            margin-bottom: 0;
            table-layout: auto;
        }

        .fixed-header thead th {
            position: sticky;
            background: white;
            z-index: 10;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        .fixed-header td {
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
    </style>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Заработанные бонусы</h4>
        <button class="btn btn-sm btn-outline-secondary" onclick="exportToExcel()">
            Экспорт в Excel
        </button>
    </div>

    <div class="table-scroll-container">
        <table id="bonusTable" class="table table-bordered table-hover fixed-header">
            <thead class="table-light">
            <tr>
                <th>ФИО</th>
                <th>Должность</th>
                <th>Департамент</th>
                <th>Всего заработано</th>
                <th>Всего Бонус</th>
                <th>Бонус за кандидата</th>
                <th>Заработано за кандидата</th>
                <th>Имя кандидата</th>
                <th>Наименование компании</th>
                <th>Процент</th>
                <th>Месяц</th>
                <th>Год</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="userBonus : ${userBonus}">
                <!-- Строка для пользователей без деталей -->
                <tr th:if="${userBonus.userBonusDetails.empty}">
                    <td th:text="${userBonus.fio}"></td>
                    <td th:text="${userBonus.position}"></td>
                    <td th:text="${userBonus.department}"></td>
                    <td th:text="${#numbers.formatDecimal(userBonus.sumTotal, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(userBonus.moneyAll, 1, 2)}"></td>
                    <td colspan="8">Нет данных о бонусах</td>
                </tr>

                <!-- Строки для пользователей с деталями -->
                <tr th:each="detail, iter : ${userBonus.userBonusDetails}">
                    <!-- Показываем информацию о пользователе только в первой строке -->
                    <td th:if="${iter.first}" th:text="${userBonus.fio}"
                        th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                    <td th:if="${iter.first}" th:text="${userBonus.position}"
                        th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                    <td th:if="${iter.first}" th:text="${userBonus.department}"
                        th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                    <td th:if="${iter.first}" th:text="${#numbers.formatDecimal(userBonus.sumTotal, 1, 2)}"
                        th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>
                    <td th:if="${iter.first}" th:text="${#numbers.formatDecimal(userBonus.moneyAll, 1, 2)}"
                        th:attr="rowspan=${userBonus.userBonusDetails.size()}"></td>

                    <!-- Детали бонуса -->
                    <td th:text="${#numbers.formatDecimal(detail.moneyByCandidate, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(detail.sumUser, 1, 2)}"></td>
                    <td th:text="${detail.candidateName}"></td>
                    <td th:text="${detail.companyName}"></td>
                    <td th:text="${detail.percent} + '%'"></td>
                    <td th:text="${detail.monthName}"></td>
                    <td th:text="${detail.year}"></td>
                    <td>
                        <button class="btn btn-sm btn-primary">Подробнее</button>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>

    <script th:inline="javascript">
        function exportToExcel() {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.table_to_sheet(document.getElementById('bonusTable'));
            XLSX.utils.book_append_sheet(wb, ws, "Бонусы");

            const dateFrom = document.getElementById('dateFrom').value || '';
            const dateTo = document.getElementById('dateTo').value || '';
            XLSX.writeFile(wb, `Бонусы_${dateFrom}_${dateTo}.xlsx`);
        }
    </script>
</div>
</html>
