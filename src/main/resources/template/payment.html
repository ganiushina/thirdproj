<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Bonus</title>
    <style>
        body {
            margin: 0;
            padding: 3px;
            font-family: Arial, sans-serif;
        }
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        table {
            width: calc(100% - 6px);
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            word-wrap: break-word;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .summary {
            margin-top: 15px;
            font-weight: bold;
        }
        .act-table {
            width: 100%;
            margin-top: 5px;
            border-collapse: collapse;
        }
        .act-table th, .act-table td {
            border: 1px solid #ccc;
            padding: 5px;
            font-size: 0.9em;
        }
        .hidden-row {
            display: none;
        }
        .bonus-container {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 100%;
        }

        .bonus-checkbox {
            margin: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        .bonus-amount {
            flex-grow: 1;
        }
        .act-table {
            table-layout: fixed; /* Фиксированная ширина колонок */
        }

        .act-table th:nth-child(5),
        .act-table td:nth-child(5) {
            width: 150px; /* Ширина колонки с бонусом */
        }
        .stats-block {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            min-width: 200px;
        }

        .stat-label {
            font-weight: bold;
            margin-right: 10px;
            color: #495057;
        }

        .stat-value {
            color: #212529;
            font-family: monospace;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
<h1>Бонусы к выплате</h1>

<div class="filter-container">
    <div class="filter-group">
        <label for="date1">Дата от</label>
        <input type="date" id="date1" th:value="${date1}">
    </div>

    <div class="filter-group">
        <label for="date2">Дата до</label>
        <input type="date" id="date2" th:value="${date2}">
    </div>

    <div class="filter-group">
        <label for="searchFio">Поиск по ФИО</label>
        <input type="text" id="searchFio" placeholder="Введите имя..." oninput="filterTable()">
    </div>

    <div class="filter-group">
        <label for="searchDepartment">Поиск по отделу</label>
        <input type="text" id="searchDepartment" placeholder="Введите отдел..." oninput="filterTable()">
    </div>

    <div class="filter-group">
        <button type="button" onclick="applyDateFilter()">Применить</button>
    </div>
    <div class="export-actions">
        <button onclick="exportToExcel()" class="btn btn-success">
            <i class="fas fa-file-excel"></i> Выгрузить в Excel
        </button>
    </div>
</div>

<!-- Статический блок статистики -->
<div class="stats-block">
    <div class="summary">
        <div>Всего к оплате: <span th:text="${allMoney}"></span></div>
        <div>Оплачено: <span th:text="${allPaymentMoney}" id="paidTotal"></span></div>
        <div>Осталось: <span th:text="${allNotPaymentMoney}" id="notPaidTotal"></span></div>
        <div>Из них: <span th:text="${moneyByDate}"></span></div>
    </div>
</div>

<table id="mainTable">
    <thead>
    <tr>
        <th style="width: 8%;">ФИО</th>
        <th style="width: 8%;">Отдел</th>
        <th style="width: 10%;">Всего Бонус</th>
        <th style="width: 74%;">Акты</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employer : ${employerList}" class="employer-row"
        th:attr="data-fio=${employer.manFIO}, data-department=${employer.userDepartment}">
        <td th:text="${employer.manFIO}"></td>
        <td th:text="${employer.userDepartment}"></td>
        <td th:text="${employer.allBonusRUB}"></td>
        <td>
            <table class="act-table">
                <thead>
                <tr>
                    <th>Кандидат</th>
                    <th>Компания</th>
                    <th>Номер акта</th>
                    <th>Дата акта</th>
                    <th>Бонус</th>
                    <th>Процент</th>
                    <th>Дата выплаты бонуса</th>
                    <th>Дата оплаты клиентом</th>
                    <th>Дата оплаты компанией</th>
                    <th>Оплативший сотрудник</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="act,actIter : ${employer.actList}">
                    <td th:text="${act.candidate}"></td>
                    <td th:text="${act.companies}"></td>
                    <td th:text="${act.num}"></td>
                    <td th:text="${act.date}"></td>
                    <td>
                        <div class="bonus-container">
                            <input type="checkbox" class="bonus-checkbox"
                                   th:checked="${act.paid}"
                                   th:data-act-id="${act.id}"
                                   th:data-employer-id="${employer.manId}"
                                   th:data-candidate="${act.candidate}"
                                   th:data-projects="${act.projects}"
                                   th:data-bonus="${act.bonus}"
                                   th:data-paid="${act.paid}"
                                   th:data-date-payment="${act.datePayment}"
                                   onchange="updatePaymentStatus(this)">
                            <span class="bonus-amount" th:text="${act.bonusRUB}"></span>
                        </div>
                    </td>
                    <td th:with="percentValue=${employer.percent != null and actIter.index < #lists.size(employer.percent) ? employer.percent[actIter.index] : null}"
                        th:text="${percentValue != null} ? ${percentValue} : ''"></td>
                    <td th:text="${act.dateForPay}"></td>
                    <td th:text="${act.datePayment}"></td>
                    <td th:text="${act.paymentRealDate}"></td> <!-- Будет пусто, если null -->
                    <td th:text="${act.employerPaid}"></td>
                </tr>
                </tbody>
            </table>
        </td>
    </tr>
    </tbody>
</table>

<script>
    function filterTable() {
        const nameFilter = document.getElementById('searchFio').value.toLowerCase();
        const deptFilter = document.getElementById('searchDepartment').value.toLowerCase();

        document.querySelectorAll('.employer-row').forEach(row => {
            const fio = row.getAttribute('data-fio').toLowerCase();
            const department = row.getAttribute('data-department').toLowerCase();

            const nameMatch = fio.includes(nameFilter);
            const deptMatch = department.includes(deptFilter);

            if (nameMatch && deptMatch) {
                row.classList.remove('hidden-row');
            } else {
                row.classList.add('hidden-row');
            }
        });
    }

    function applyDateFilter() {
        const date1 = document.getElementById('date1').value;
        const date2 = document.getElementById('date2').value;

        if (!date1 || !date2) {
            alert('Please select both date ranges');
            return;
        }

        window.location.href = `/amount/allpayment3?date1=${date1}&date2=${date2}`;
    }

    // Initialize filters from URL parameters if present
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const searchFio = urlParams.get('searchFio');
        const searchDepartment = urlParams.get('searchDepartment');

        if (searchFio) {
            document.getElementById('searchFio').value = searchFio;
        }

        if (searchDepartment) {
            document.getElementById('searchDepartment').value = searchDepartment;
        }

        if (searchFio || searchDepartment) {
            filterTable();
        }
    });

     function updatePaymentStatus(checkbox) {
        try {
            const isChecked = checkbox.checked;
            const bonus = parseFloat(checkbox.getAttribute('data-bonus'));
            const row = checkbox.closest('tr');
            const datePaymentValue = checkbox.getAttribute('data-date-payment');

            const paidSpan = document.getElementById('paidTotal');
            const notPaidSpan = document.getElementById('notPaidTotal');

            // Проверяем, что элементы существуют
            if (!paidSpan || !notPaidSpan) {
                throw new Error("Не найдены элементы для отображения сумм");
            }

            // Получаем текущие значения с проверкой
            const paidText = paidSpan.textContent || "0";
            const notPaidText = notPaidSpan.textContent || "0";

            let paidTotal = parseFloat(paidText.replace(/\s+/g, '')) || 0;
            let notPaidTotal = parseFloat(notPaidText.replace(/\s+/g, '')) || 0;

            // Формируем данные для отправки
            const data = {
                actId: parseInt(checkbox.getAttribute('data-act-id')),
                employerId: parseInt(checkbox.getAttribute('data-employer-id')),
                candidate: checkbox.getAttribute('data-candidate'),
                bonus: bonus,
                paid: isChecked,
                datePayment: datePaymentValue
            };

            // Оптимистичное обновление UI
            if (isChecked) {
                paidTotal += bonus;
                notPaidTotal -= bonus;
            } else {
                paidTotal -= bonus;
                notPaidTotal += bonus;
            }

            paidSpan.textContent = formatMoney(paidTotal);
            notPaidSpan.textContent = formatMoney(notPaidTotal);

            // Обновляем дату и сотрудника, если элементы существуют
            if (row) {
                const paymentDateCell = row.querySelector('td:nth-child(9)');
                const employerPaidCell = row.querySelector('td:nth-child(10)');

                if (paymentDateCell) {
                    paymentDateCell.textContent = isChecked ? new Date().toLocaleDateString() : '';
                }
                if (employerPaidCell) {
                    employerPaidCell.textContent = isChecked ? "Обновление..." : '';
                }
            }

            // Отправка на сервер
            fetch('/amount/updatePaymentStatus', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || "Ошибка сервера") });
                }
                return response.json();
            })
            .then(data => {
                // Финализируем обновление
                if (data.allPaymentMoney) {
                    paidSpan.textContent = data.allPaymentMoney;
                }
                if (data.allNotPaymentMoney) {
                    notPaidSpan.textContent = data.allNotPaymentMoney;
                }

                if (row) {
                    const paymentDateCell = row.querySelector('td:nth-child(9)');
                    const employerPaidCell = row.querySelector('td:nth-child(10)');

                    if (paymentDateCell && data.paymentRealDate !== undefined) {
                        paymentDateCell.textContent = data.paymentRealDate || '';
                    }
                    if (employerPaidCell && data.employerPaid !== undefined) {
                        employerPaidCell.textContent = data.employerPaid || '';
                    }
                }
            })
            .catch(error => {
                console.error("Ошибка:", error);
                // Откатываем изменения
                checkbox.checked = !isChecked;
                paidSpan.textContent = paidText;
                notPaidSpan.textContent = notPaidText;

                if (row) {
                    const paymentDateCell = row.querySelector('td:nth-child(9)');
                    const employerPaidCell = row.querySelector('td:nth-child(10)');

                    if (paymentDateCell) {
                        paymentDateCell.textContent = isChecked ? '' : (data?.paymentRealDate || '');
                    }
                    if (employerPaidCell) {
                        employerPaidCell.textContent = isChecked ? '' : (data?.employerPaid || '');
                    }
                }

                alert('Ошибка при обновлении: ' + error.message);
            });

        } catch (error) {
            console.error("Критическая ошибка:", error);
            checkbox.checked = !checkbox.checked;
            alert('Произошла ошибка: ' + error.message);
        }
    }

    function formatMoney(amount) {
        return amount.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$& ');
    }
    function exportToExcel() {
        // Загружаем библиотеку динамически
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        script.onload = function() {
            // Создаем рабочую книгу
            const wb = XLSX.utils.book_new();

            // Получаем данные таблицы
            const table = document.getElementById('mainTable');
            const ws = XLSX.utils.table_to_sheet(table, {
                raw: true, // Берем исходные значения (не форматированные)
                dateNF: 'dd.mm.yyyy', // Формат дат
                cellDates: true // Интерпретировать даты как объекты Date
            });

            // Применяем числовые форматы для денежных колонок
            const moneyColumns = [4, 5, 6]; // Индексы денежных колонок (начиная с 0)
            const range = XLSX.utils.decode_range(ws['!ref']);

            for (let C = range.s.c; C <= range.e.c; ++C) {
                if (moneyColumns.includes(C)) {
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        const cell_address = {c:C, r:R};
                        const cell_ref = XLSX.utils.encode_cell(cell_address);
                        if (ws[cell_ref] && ws[cell_ref].t === 'n') {
                            // Форматируем как число с 2 знаками после запятой
                            ws[cell_ref].z = '#,##0.00';
                        }
                    }
                }
            }

            // Добавляем лист в книгу
            XLSX.utils.book_append_sheet(wb, ws, "Платежи");

            // Генерируем и скачиваем файл
            XLSX.writeFile(wb, 'payments_report.xlsx', {
                bookType: 'xlsx',
                type: 'array'
            });
        };
        document.head.appendChild(script);
    }


</script>
</body>
</html>
