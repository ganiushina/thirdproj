<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
        <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
        <title>Add Users using ajax</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.0.0/jquery.min.js"></script>

</head>
<body>
<h1>Add Users using Ajax ........</h1>
<table>
        <tr><td>Enter your name : </td><td> <input type="text" id="name"><br/></td></tr>
        <tr><td>Education : </td><td> <input type="text" id="education"><br/></td></tr>
        <tr><td colspan="2"><input type="button" value="Add Users" onclick="doAjaxPost()"><br/></td></tr>
        <tr><td colspan="2"><div id="info" style="color: green;"></div></td></tr>
</table>
<a href="/AjaxWithSpringMVC2Annotations/ShowUsers.htm">Show All Users</a>

<script type="text/javascript">
        function doAjaxPost() {
             var status = this.value;
                   $.ajax({
                      type: 'post', // method attribute of form
                      url: '/payment/confirm',  // action attribute of form
<!--                      dataType : 'json',-->

                      data : status,
                      success     :   function () {
                         alert("success");
                      }
                  });
        }
</script>

</body>
</html>
