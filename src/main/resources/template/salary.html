<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<!--     Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Bundle JS (includes Popper) -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js" integrity="sha384-VC7EHuA+weHjwldfZxEtvIsj82XylcD/H1TdeiJd2NqIT8dIyK9i6SgM7QKjT1Sk" crossorigin="anonymous"></script>
    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>


</head>
<body>

<div th:replace="~{navigation :: navi(Cart)}"/>

<div class="container mt-5">
    <h1>Выплаченные деньги</h1>

</div>
<form th:action="@{/salary/getSalaryAll}" method="get">

    <input required th:value="${date1 != null} ? ${date1}" th:name="date1"  type="date"  placeholder="Дата от ">
    <input required th:value="${date2 != null} ? ${date2}" th:name="date2" type="date"  placeholder="Дата до">

    <input type="text" id="inputName" onkeyup="myFunction()" placeholder="Поиск по фамилии.." title="Find in a name">
    <input type="text" id="inputDepartment" onkeyup="searchDep()" placeholder="Поиск по отделу.." title="Find in a department">

    <button type="submit" class="btn btn-primary">Фильтровать</button>
</form>

<ul class="nav nav-tabs" role="tablist">
    <li class="nav-item" role="presentation">
        <a class="nav-link active" id="simple-tab-0" data-bs-toggle="tab" href="#simple-tabpanel-0" role="tab" aria-controls="simple-tabpanel-0" aria-selected="true">Выплаты</a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link" id="simple-tab-1" data-bs-toggle="tab" href="#simple-tabpanel-1" role="tab" aria-controls="simple-tabpanel-1" aria-selected="false">Реализация</a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link" id="simple-tab-2" data-bs-toggle="tab" href="#simple-tabpanel-2" role="tab" aria-controls="simple-tabpanel-2" aria-selected="false">Маржа</a>
    </li>
</ul>

<div class="tab-content pt-5" id="tab-content">
    <div class="tab-pane active" id="simple-tabpanel-0" role="tabpanel" aria-labelledby="simple-tab-0"></div>
    <table id="myTable" class="table table-bordered">
        <thead>
        <tr>
            <th scope="col">ФИО</th>
            <th scope="col">Прозиция</th>
            <th scope="col">Отдел</th>
            <th scope="col">Бонус</th>
            <th scope="col">Бонус KPI</th>
            <th scope="col">Зарплата</th>
            <th scope="col">Вся сумма</th>
            <th scope="col">Месяц</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="userSalary, iterStat : ${userSalaryList}" th:object="${userSalaryList}">
            <td th:text="${userSalary.fio}"></td>
            <td th:text="${userSalary.position}"></td>
            <td th:text="${userSalary.department}"></td>

            <td>
                <ul class="list-inline">
                <span th:each="bonus : ${userSalary.userBonus}">
                    <li>
                        <span  th:text="${bonus}"/></span>
                    </li>
                </ul>
            </td>

            <td>
                <ul class="list-inline">
                <span th:each="bonus : ${userSalary.userBonusKPI}">
                    <li>
                        <span  th:text="${bonus}"/></span>
                    </li>
                </ul>
            </td>
            <td>
                <ul class="list-inline">
                <span th:each="bonus : ${userSalary.userSalary}">
                    <li>
                        <span  th:text="${bonus}"/></span>
                    </li>
                </ul>
            </td>
            <td>

                <ul class="list-inline">
                <span th:each="bonus : ${userSalary.userSalaryAll}">
                    <li>
<!--                        <input id="agreement" type="checkbox" name="salaryAll" >-->
                        <span  th:text="${bonus}"/></span>
                    </li>
                </ul>
            </td>
            <td>
                <ul class="list-inline">
                <span th:each="month : ${userSalary.salaryMonthStr}">
                    <li>
                        <span  th:text="${month}"/></span>
                    </li>
                </ul>
            </td>
        </tr>
        </tbody>
    </table>
</div>

    <div class="tab-pane" id="simple-tabpanel-1" role="tabpanel" aria-labelledby="simple-tab-1"></div>

            <table id="myTable1" class="table table-bordered">
                <thead>
                <tr>
                    <th scope="col">Направление</th>
                    <th scope="col">Департамент</th>
                    <th scope="col">Заработано департаментом</th>
                    <th scope="col">Заработано направлением</th>
                    <th scope="col">Выплачено направлению</th>
                    <th scope="col">Маржа направления</th>
                    <th scope="col">Маржа департамента</th>
                    <th scope="col">Бонус BDM</th>
                    <th scope="col">Квартал</th>
                    <th scope="col">Год</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="marginBonus, iterStat : ${marginBonusList}" th:object="${marginBonusList}">
                    <td th:text="${marginBonus.departmentName}"></td>
                    <td th:text="${marginBonus.divisionName}"></td>


                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.earnedMoneyDepartment}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>

                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.earnedMoneyDivision}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>
                    <td>

                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.paidMoney}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>

                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.marginDepartment}">
                                <li>
<!--                        <input id="agreement" type="checkbox" name="salaryAll" >-->
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>

                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.marginDivision}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>

                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.marginBonusBDM}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>
                    <td>
                        <ul class="list-inline">
                            <span th:each="margin : ${marginBonus.marginQuarter}">
                                <li>
                                    <span  th:text="${margin}"/></span>
                            </li>
                        </ul>
                    </td>

                    <td th:text="${marginBonus.marginYear}"></td>

                </tr>
                </tbody>
            </table>
</div>
</div>











<script>
    function myFunction() {
               var input, filter, table, tr, td, i;
               input = document.getElementById("inputName");
               filter = input.value.toUpperCase();
               table = document.getElementById("myTable");
               tr = table.getElementsByTagName("tr");

               for (i = 0; i < tr.length; i++) {
                   td = tr[i].getElementsByTagName("td")[0];
                   if (td) {
                       if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                           tr[i].style.display = "";
                       } else {
                           tr[i].style.display = "none";
                       }
                   }
               }
           }

           function searchDep() {
               var input, filter, table, tr, td, i;
               input = document.getElementById("inputDepartment");
               filter = input.value.toUpperCase();
               table = document.getElementById("myTable");
               tr = table.getElementsByTagName("tr");
               for (i = 0; i < tr.length; i++) {
                   td = tr[i].getElementsByTagName("td")[2];
                   if (td) {
                       if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                           tr[i].style.display = "";
                       } else {
                           tr[i].style.display = "none";
                       }
                   }
               }
           }

</script>

</body>
</html>
