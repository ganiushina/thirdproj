         function filterByMonth(inputElement) {
            const filter = inputElement.value.trim().toLowerCase();
            const table = document.getElementById('interpreters');

            // 1. Сначала скрываем ВСЕ строки
            table.querySelectorAll('tbody tr').forEach(row => {
                row.style.display = 'none';
            });

            // 2. Показываем только подходящие строки
            table.querySelectorAll('tbody tr').forEach(row => {
                const monthText = row.getAttribute('data-month').toLowerCase();
                if (!filter || monthText.includes(filter)) {
                    row.style.display = '';
                }
            });

            // 3. Восстанавливаем группы пользователей
            rebuildUserGroups();
        }

        function rebuildUserGroups() {
            const table = document.getElementById('interpreters');
            const allRows = Array.from(table.querySelectorAll('tbody tr'));
            const userGroups = {};

            // 1. Группируем ВИДИМЫЕ строки по пользователям
            allRows.forEach(row => {
                if (row.style.display !== 'none') {
                    const key = [
                        row.getAttribute('data-user-fio'),
                        row.getAttribute('data-position'),
                        row.getAttribute('data-department')
                    ].join('|');

                    if (!userGroups[key]) {
                        userGroups[key] = [];
                    }
                    userGroups[key].push(row);
                }
            });

            // 2. Обновляем rowspan для каждой группы
            Object.values(userGroups).forEach(rows => {
                // Удаляем все объединенные ячейки
                rows.forEach(row => {
                    row.querySelectorAll('td[rowspan]').forEach(td => td.remove());
                });

                // Добавляем новые объединенные ячейки только в первую строку
                const firstRow = rows[0];
                const userFio = firstRow.getAttribute('data-user-fio');
                const position = firstRow.getAttribute('data-position');
                const department = firstRow.getAttribute('data-department');

                // Создаем новые ячейки с rowspan
                const fioCell = document.createElement('td');
                fioCell.textContent = userFio;
                fioCell.setAttribute('rowspan', rows.length);
                firstRow.insertBefore(fioCell, firstRow.firstChild);

                const positionCell = document.createElement('td');
                positionCell.textContent = position;
                positionCell.setAttribute('rowspan', rows.length);
                firstRow.insertBefore(positionCell, firstRow.children[1]);

                const departmentCell = document.createElement('td');
                departmentCell.textContent = department;
                departmentCell.setAttribute('rowspan', rows.length);
                firstRow.insertBefore(departmentCell, firstRow.children[2]);
            });
        }

        function resetMonthFilter() {
            const table = document.getElementById('interpreters');

            // 1. Показываем все строки
            table.querySelectorAll('tbody tr').forEach(row => {
                row.style.display = '';
            });

            // 2. Восстанавливаем исходные группы
            rebuildUserGroups();
        }

                                          }
                                      }
                    }
            }
        }

<!-- Tab Content Loading Script -->
<script>
    // Load content when page first loads
    document.addEventListener('DOMContentLoaded', function() {
        loadTabContent('/margin/summary', 'summaryTab');
    });

    // Function to load tab content via AJAX
    function loadTabContent(url, fragment) {
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;

        let params = new URLSearchParams();
        if (dateFrom) params.append('dateFrom', dateFrom);
        if (dateTo) params.append('dateTo', dateTo);

        const targetDiv = fragment === 'summaryTab' ? 'summaryContent' : fragment === 'interpreterTab' ? 'interpreterContent' :
                        fragment === 'detailsTab' ? 'detailsContent' : 'chartsContent';

        fetch(`${url}?${params.toString()}`)
            .then(response => response.text())
            .then(html => {
                document.getElementById(targetDiv).innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading tab content:', error);
                document.getElementById(targetDiv).innerHTML =
                    '<div class="alert alert-danger">Error loading content</div>';
            });
    }

    // Reload active tab when filter changes
    function loadActiveTab() {
        const activeTab = document.querySelector('#reportTabs .nav-link.active');
        if (activeTab) {
            activeTab.click();
        }
    }


</script>

<script>
    // Общая функция сортировки (добавить в main.html)
    function initTableSorting() {
        document.querySelectorAll('.table-sortable').forEach(table => {
            const headers = table.querySelectorAll('thead th');

            headers.forEach((header, columnIndex) => {
                header.addEventListener('click', () => {
                    const direction = header.classList.contains('sorted-asc') ? 'desc' : 'asc';

                    // Сброс предыдущей сортировки
                    headers.forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
                    header.classList.add(`sorted-${direction}`);

                    // Сортировка
                    const rows = Array.from(table.querySelectorAll('tbody tr'));
                    rows.sort((a, b) => {
                        const aVal = a.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                        const bVal = b.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                        return compareValues(aVal, bVal, direction);
                    });

                    // Обновление таблицы
                    table.querySelector('tbody').replaceChildren(...rows);
                });
            });
        });
    }

    // Вспомогательная функция сравнения
    function compareValues(a, b, direction) {
        const isNumeric = !isNaN(a) && !isNaN(b);
        const result = isNumeric ? parseFloat(a) - parseFloat(b) : a.localeCompare(b);
        return direction === 'asc' ? result : -result;
    }

    // Инициализация при загрузке и после AJAX
    document.addEventListener('DOMContentLoaded', initTableSorting);

    // Для динамически загружаемых таблиц (например, во вкладках)
    function onTabLoaded() {
        setTimeout(initTableSorting, 50); // Небольшая задержка для гарантии загрузки DOM
    }

    function sortTable(table, columnIndex, direction) {
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));

        rows.sort((rowA, rowB) => {
            const cellA = rowA.querySelector(`td:nth-child(${columnIndex + 1})`);
            const cellB = rowB.querySelector(`td:nth-child(${columnIndex + 1})`);
            let aValue = cellA ? cellA.textContent.trim() : '';
            let bValue = cellB ? cellB.textContent.trim() : '';

            // Для ячеек со списками берем первое значение
            if (aValue.includes('\n')) {
                aValue = aValue.split('\n')[0];
            }
            if (bValue.includes('\n')) {
                bValue = bValue.split('\n')[0];
            }

            // Дальнейшая логика сортировки...
    });



</script>
