                        // Функции фильтрации для таблицы interpreters
        function nameFilterInterpreters(inputElement) {
            const tableId = inputElement.getAttribute('data-table-id');
            const table = document.getElementById(tableId);
            const filter = inputElement.value.trim().toUpperCase();

            if (!filter) {
                resetFiltersForTable(tableId);
                return;
            }

            // Сначала скрываем все строки
            table.querySelectorAll('tbody tr').forEach(row => {
                row.style.display = 'none';
            });

            // Показываем только группы, где имя соответствует фильтру
            const userGroups = {};
            table.querySelectorAll('tbody tr').forEach(row => {
                const userKey = row.getAttribute('data-user-fio') + '|' +
                              row.getAttribute('data-position') + '|' +
                              row.getAttribute('data-department');

                if (!userGroups[userKey]) {
                    userGroups[userKey] = {
                        name: row.getAttribute('data-user-fio'),
                        rows: []
                    };
                }
                userGroups[userKey].rows.push(row);
            });

            // Применяем фильтр по имени
            Object.values(userGroups).forEach(group => {
                const isMatch = group.name.toUpperCase().includes(filter);
                group.rows.forEach(row => {
                    row.style.display = isMatch ? '' : 'none';
                });
            });

            rebuildRowspans(tableId);
        }

        function departmentFilterInterpreters(inputElement) {
            const tableId = inputElement.getAttribute('data-table-id');
            const table = document.getElementById(tableId);
            const filter = inputElement.value.trim().toUpperCase();

            if (!filter) {
                resetFiltersForTable(tableId);
                return;
            }

            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const deptCell = row.querySelector('td:nth-child(3)');
                if (deptCell) {
                    const deptText = deptCell.textContent.toUpperCase();
                    row.style.display = deptText.includes(filter) ? '' : 'none';
                }
            });
            rebuildRowspans(tableId);
        }

        function filterByMonthInterpreters(inputElement) {
            const tableId = inputElement.getAttribute('data-table-id');
            const table = document.getElementById(tableId);
            const filter = inputElement.value.trim().toLowerCase();

            if (!filter) {
                resetFiltersForTable(tableId);
                return;
            }

            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const monthCell = row.querySelector('.month-cell');
                if (monthCell) {
                    const monthText = monthCell.textContent.toLowerCase();
                    row.style.display = monthText.includes(filter) ? '' : 'none';
                }
            });
            rebuildRowspans(tableId);
        }

        // Сброс фильтров для таблицы
        function resetFiltersForTable(tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;

            table.querySelectorAll('tbody tr').forEach(row => {
                row.style.display = '';
            });
            rebuildRowspans(tableId);
        }

        // Перестроение rowspan для таблицы
        function rebuildRowspans(tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;

            const userGroups = {};

            // Группируем видимые строки по пользователям
            table.querySelectorAll('tbody tr').forEach(row => {
                if (row.style.display !== 'none') {
                    const userKey = row.getAttribute('data-user-fio') + '|' +
                                  row.getAttribute('data-position') + '|' +
                                  row.getAttribute('data-department');

                    if (!userGroups[userKey]) {
                        userGroups[userKey] = [];
                    }
                    userGroups[userKey].push(row);
                }
            });

            // Удаляем все существующие объединенные ячейки
            table.querySelectorAll('td[rowspan]').forEach(cell => cell.remove());

            // Создаем новые объединенные ячейки для каждой группы
            Object.values(userGroups).forEach(group => {
                if (group.length === 0) return;

                const firstRow = group[0];

                // Создаем и добавляем объединенные ячейки
                const addMergedCell = (content, position) => {
                    const cell = document.createElement('td');
                    cell.textContent = content;
                    cell.setAttribute('rowspan', group.length);

                    // Вставляем ячейку в правильную позицию
                    if (firstRow.children.length > position) {
                        firstRow.children[position].before(cell);
                    } else {
                        firstRow.appendChild(cell);
                    }
                };

                addMergedCell(firstRow.getAttribute('data-user-fio'), 0);
                addMergedCell(firstRow.getAttribute('data-position'), 1);
                addMergedCell(firstRow.getAttribute('data-department'), 2);
            });
        }

        // Debounce для оптимизации
        let filterTimeout;
        function debounceFilter(filterFunc, inputElement) {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => filterFunc(inputElement), 300);
        }


        function exportToExcel(tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;

            // Создаем временную таблицу для экспорта
            const tempTable = document.createElement('table');

            // Копируем заголовки
            const thead = table.querySelector('thead');
            if (thead) {
                tempTable.appendChild(thead.cloneNode(true));
            }

            // Обрабатываем строки данных
            const tbody = document.createElement('tbody');
            const visibleRows = Array.from(table.querySelectorAll('tbody tr'))
                .filter(row => row.style.display !== 'none');

            // Группируем строки по пользователям
            const userGroups = {};
            visibleRows.forEach(row => {
                const userKey = row.getAttribute('data-user-fio') + '|' +
                              row.getAttribute('data-position') + '|' +
                              row.getAttribute('data-department');

                if (!userGroups[userKey]) {
                    userGroups[userKey] = {
                        userFio: row.getAttribute('data-user-fio'),
                        position: row.getAttribute('data-position'),
                        department: row.getAttribute('data-department'),
                        rows: []
                    };
                }
                userGroups[userKey].rows.push(row);
            });

            // Создаем строки для экспорта
            Object.values(userGroups).forEach(group => {
                group.rows.forEach((row, index) => {
                    const newRow = document.createElement('tr');

                    // Добавляем объединенные ячейки только для первой строки группы
                    if (index === 0) {
                        const fioCell = document.createElement('td');
                        fioCell.textContent = group.userFio;
                        newRow.appendChild(fioCell);

                        const positionCell = document.createElement('td');
                        positionCell.textContent = group.position;
                        newRow.appendChild(positionCell);

                        const deptCell = document.createElement('td');
                        deptCell.textContent = group.department;
                        newRow.appendChild(deptCell);
                    } else {
                        // Пустые ячейки для объединенных полей
                        newRow.appendChild(document.createElement('td'));
                        newRow.appendChild(document.createElement('td'));
                        newRow.appendChild(document.createElement('td'));
                    }

                    // Копируем остальные ячейки с учетом числового формата
                    const cells = row.querySelectorAll('td:not([rowspan])');
                    cells.forEach((cell, cellIndex) => {
                        const newCell = document.createElement('td');

                        // Для числовых ячеек убираем форматирование и преобразуем в число
                        if (cell.classList.contains('numeric')) {
                            const numValue = parseFloat(cell.textContent.replace(/\s/g, '').replace(',', '.'));
                            newCell.textContent = isNaN(numValue) ? cell.textContent : numValue;
                            newCell.setAttribute('style', 'mso-number-format:#,##0.00');
                        } else {
                            newCell.textContent = cell.textContent;
                            newCell.setAttribute('style', 'mso-number-format:"\@"');
                        }

                        newRow.appendChild(newCell);
                    });

                    tbody.appendChild(newRow);
                });
            });

            tempTable.appendChild(tbody);

            // Создаем HTML для экспорта
            const html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:x="urn:schemas-microsoft-com:office:excel"
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <!--[if gte mso 9]>
                    <xml>
                        <x:ExcelWorkbook>
                            <x:ExcelWorksheets>
                                <x:ExcelWorksheet>
                                    <x:Name>Детализация выплат</x:Name>
                                    <x:WorksheetOptions>
                                        <x:DisplayGridlines/>
                                    </x:WorksheetOptions>
                                </x:ExcelWorksheet>
                            </x:ExcelWorksheets>
                        </x:ExcelWorkbook>
                    </xml>
                    <![endif]-->
                    <meta charset="UTF-8">
                    <style>
                        td {
                            padding: 2px 5px;
                            border: 1px solid #ddd;
                        }
                    </style>
                </head>
                <body>
                    ${tempTable.outerHTML}
                </body>
                </html>
            `;

            // Создаем и скачиваем файл
            const blob = new Blob([html], {type: 'application/vnd.ms-excel'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Детализация_выплат_${new Date().toLocaleDateString()}.xls`;
            link.click();
        }

<script>
    // Load content when page first loads
    document.addEventListener('DOMContentLoaded', function() {
        loadTabContent('/margin/summary', 'summaryTab');
    });

    // Function to load tab content via AJAX
    function loadTabContent(url, fragment) {
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;

        let params = new URLSearchParams();
        if (dateFrom) params.append('dateFrom', dateFrom);
        if (dateTo) params.append('dateTo', dateTo);

        const targetDiv = fragment === 'summaryTab' ? 'summaryContent' : fragment === 'interpreterTab' ? 'interpreterContent' :
                        fragment === 'detailsTab' ? 'detailsContent' : 'chartsContent';

        fetch(`${url}?${params.toString()}`)
            .then(response => response.text())
            .then(html => {
                document.getElementById(targetDiv).innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading tab content:', error);
                document.getElementById(targetDiv).innerHTML =
                    '<div class="alert alert-danger">Error loading content</div>';
            });
    }

    // Reload active tab when filter changes
    function loadActiveTab() {
        const activeTab = document.querySelector('#reportTabs .nav-link.active');
        if (activeTab) {
            activeTab.click();
        }
    }


</script>

<script>
    // Общая функция сортировки (добавить в main.html)
    function initTableSorting() {
        document.querySelectorAll('.table-sortable').forEach(table => {
            const headers = table.querySelectorAll('thead th');

            headers.forEach((header, columnIndex) => {
                header.addEventListener('click', () => {
                    const direction = header.classList.contains('sorted-asc') ? 'desc' : 'asc';

                    // Сброс предыдущей сортировки
                    headers.forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
                    header.classList.add(`sorted-${direction}`);

                    // Сортировка
                    const rows = Array.from(table.querySelectorAll('tbody tr'));
                    rows.sort((a, b) => {
                        const aVal = a.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                        const bVal = b.querySelector(`td:nth-child(${columnIndex + 1})`)?.textContent.trim();
                        return compareValues(aVal, bVal, direction);
                    });

                    // Обновление таблицы
                    table.querySelector('tbody').replaceChildren(...rows);
                });
            });
        });
    }

    // Вспомогательная функция сравнения
    function compareValues(a, b, direction) {
        const isNumeric = !isNaN(a) && !isNaN(b);
        const result = isNumeric ? parseFloat(a) - parseFloat(b) : a.localeCompare(b);
        return direction === 'asc' ? result : -result;
    }

    // Инициализация при загрузке и после AJAX
    document.addEventListener('DOMContentLoaded', initTableSorting);

    // Для динамически загружаемых таблиц (например, во вкладках)

        setTimeout(initTableSorting, 50); // Небольшая задержка для гарантии загрузки DOM
