<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Marginal profit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script th:inline="javascript">

        function departmentFilter(inputElement) {

            const value = inputElement.value;
            var tr, td, i, j;

            const filter = value.toUpperCase();

            const tableId = inputElement.getAttribute('data-table-id');
            const table = document.getElementById(tableId); // Get the table element

            if(tableId == 'salesTable' || tableId === 'myTable') {
                tr = table.getElementsByTagName("tr");
                for (i = 0; i < tr.length; i++) {
                    td = tr[i].getElementsByTagName("td")[0];
                          if (td) {
                                      if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                                          tr[i].style.display = "";
                                      } else {
                                          tr[i].style.display = "none";
                                      }
                                  }
                }
            }

            if(tableId == 'payments') {
                tr = table.getElementsByTagName("tr");
                for (i = 0; i < tr.length; i++) {
                    td = tr[i].getElementsByTagName("td")[2];
                          if (td) {
                                      if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                                          tr[i].style.display = "";
                                      } else {
                                          tr[i].style.display = "none";
                                      }
                                  }
                }
            }

        }

        function monthFilter(inputElement) {

            if(tableId == 'payments'){
                tr = table.getElementsByTagName("tr");
                    for (i = 0; i < tr.length; i++) {
                        td = tr[i].getElementsByTagName("td")[8];
                              if (td) {
                                          if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                                              tr[i].style.display = "";
                                          } else {
                                              tr[i].style.display = "none";
                                          }
                                      }
                    }
            }
        }

        function nameFilter(inputElement) {

            var tr, td, i, j;
            const value = inputElement.value;
            const filter = value.toUpperCase();
            const tableId = inputElement.getAttribute('data-table-id');
            const table = document.getElementById(tableId); // Get the table element

            if(tableId == 'payments'){
                tr = table.getElementsByTagName("tr");
                    for (i = 0; i < tr.length; i++) {
                        td = tr[i].getElementsByTagName("td")[0];
                              if (td) {
                                          if (td.innerHTML.toUpperCase().indexOf(filter) > -1) {
                                              tr[i].style.display = "";
                                          } else {
                                              tr[i].style.display = "none";
                                          }
                                      }
                    }
            }
        }

    </script>
    <style>
        /* Основной контейнер для таблицы */
        .sticky-table-wrapper {
            position: relative;
            overflow: visible;
        }

        /* Фиксируем заголовок ПОД навигацией */
        .sticky-table-wrapper table thead th {
            position: sticky;
            top: 56px; /* Высота навигации (подставьте своё значение) */
            background: white;
            z-index: 500; /* Ниже навигации (у неё обычно z-index: 1000) */
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        /* Если навигация имеет тень/бордер - добавим отступ */
        .sticky-table-wrapper table thead th {
            margin-top: 1px;
        }
    </style>

</head>
<div th:replace="~{navigation :: navi(Home)}" />

<body>
<div class="container mt-4">
    <h2>Маржинальная прибыль</h2>


    <!-- Date Range Filter Form -->
    <form id="dateFilterForm" class="mb-4">
        <div class="row">
            <div class="col-md-3">
                <label for="dateFrom" class="form-label">От:</label>
                <input type="date" class="form-control" id="dateFrom" name="dateFrom"
                       th:value="${dateFrom != null} ? ${#temporals.format(dateFrom, 'yyyy-MM-dd')}">

            </div>
            <div class="col-md-3">
                <label for="dateTo" class="form-label">До:</label>
                <input type="date" class="form-control" id="dateTo" name="dateTo"
                       th:value="${dateTo != null} ? ${#temporals.format(dateTo, 'yyyy-MM-dd')}">
            </div>

            <div class="col-md-2 align-self-end">
                <button type="button" class="btn btn-primary" onclick="loadActiveTab()">Применить</button>
            </div>
        </div>
    </form>


    <!-- Tabs Navigation -->
    <ul class="nav nav-tabs" id="reportTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="summary-tab" data-bs-toggle="tab"
                    data-bs-target="#summary" type="button" role="tab"
                    aria-controls="summary" aria-selected="true"
                    onclick="loadTabContent('/margin/summary', 'summaryTab')">
                Помесячно
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="details-tab" data-bs-toggle="tab"
                    data-bs-target="#details" type="button" role="tab"
                    aria-controls="details" aria-selected="false"
                    onclick="loadTabContent('/margin/detailed', 'detailsTab')">
                Поквартально
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="charts-tab" data-bs-toggle="tab"
                    data-bs-target="#charts" type="button" role="tab"
                    aria-controls="charts" aria-selected="false"
                    onclick="loadTabContent('/margin/charts', 'chartsTab')">
                Выплаты
            </button>
        </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content p-3 border border-top-0 rounded-bottom" id="reportTabsContent">
        <!-- Summary Tab Content -->
        <div class="tab-pane fade show active" id="summary" role="tabpanel" aria-labelledby="summary-tab">
            <div id="summaryContent">
                <!-- Content will be loaded via AJAX -->
                <div class="text-center my-5">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detailed Report Tab Content -->
        <div class="tab-pane fade" id="details" role="tabpanel" aria-labelledby="details-tab">
            <div id="detailsContent">
                <!-- Content will be loaded via AJAX -->
            </div>
        </div>

        <!-- Charts Tab Content -->
        <div class="tab-pane fade" id="charts" role="tabpanel" aria-labelledby="charts-tab">
            <div id="chartsContent">
                <!-- Content will be loaded via AJAX -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tab Content Loading Script -->
<script>
    // Load content when page first loads
    document.addEventListener('DOMContentLoaded', function() {
        loadTabContent('/margin/summary', 'summaryTab');
    });

    // Function to load tab content via AJAX
    function loadTabContent(url, fragment) {
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;

        let params = new URLSearchParams();
        if (dateFrom) params.append('dateFrom', dateFrom);
        if (dateTo) params.append('dateTo', dateTo);

        const targetDiv = fragment === 'summaryTab' ? 'summaryContent' :
                        fragment === 'detailsTab' ? 'detailsContent' : 'chartsContent';

        fetch(`${url}?${params.toString()}`)
            .then(response => response.text())
            .then(html => {
                document.getElementById(targetDiv).innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading tab content:', error);
                document.getElementById(targetDiv).innerHTML =
                    '<div class="alert alert-danger">Error loading content</div>';
            });
    }

    // Reload active tab when filter changes
    function loadActiveTab() {
        const activeTab = document.querySelector('#reportTabs .nav-link.active');
        if (activeTab) {
            activeTab.click();
        }
    }


</script>
