<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Бонусные схемы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --nav-height: 56px;
        }

        body {
            padding-top: var(--nav-height);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            height: var(--nav-height);
        }

        .main-content {
            position: relative;
        }

        .table-sticky thead th {
            position: sticky;
            top: var(--nav-height);
            background: white !important;
            z-index: 1020;
            border-bottom: 2px solid #dee2e6 !important;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1);
        }

        .table-sticky {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }

        .table-sticky th,
        .table-sticky td {
            border: 1px solid #dee2e6;
            padding: 8px;
            text-align: center;
        }

        .table-sticky th:nth-child(1),
        .table-sticky td:nth-child(1) {
            text-align: left;
            background-color: #f8f9fa;
        }

        .table-sticky td:nth-child(1) {
            font-weight: normal !important;
        }

        .card {
            border: 1px solid rgba(0,0,0,.125);
            border-radius: 0.375rem;
            margin-bottom: 20px;
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-title {
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .range-chip {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 4px 8px;
            margin: 2px;
            font-size: 0.8rem;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            white-space: nowrap;
        }

        .range-chip .percent {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div th:replace="~{navigation :: navi('BonusSchemes')}"></div>

<main class="main-content">
    <div class="container-fluid mt-4 px-3">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- ФОРМА ДОБАВЛЕНИЯ СХЕМЫ -->
                <div class="card mb-4 shadow-sm" sec:authorize="hasRole('MANAGER')">
                    <div class="card-body">
                        <h3 class="card-title mb-3">Добавить бонусную схему</h3>
                        <form th:action="@{/bonus-schemes}"
                              th:object="${schemeEntry}"
                              method="post"
                              class="row g-3">

                            <div class="col-md-3">
                                <label class="form-label" for="schemeId">Название схемы</label>
                                <select class="form-select" id="schemeId" th:field="*{schemeId}" required>
                                    <option value="" disabled selected>Выберите схему</option>
                                    <option th:each="scheme : ${schemeNames}"
                                            th:value="${scheme.id}"
                                            th:text="${scheme.schemeName}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label" for="positionId">Должность</label>
                                <select class="form-select" id="positionId" th:field="*{positionId}" required>
                                    <option value="" disabled selected>Выберите должность</option>
                                    <option th:each="position : ${positions}"
                                            th:value="${position.id}"
                                            th:text="${position.posName}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label" for="limits">Лимит</label>
                                <input type="number"
                                       step="1"
                                       min="0"
                                       class="form-control"
                                       id="limits"
                                       th:field="*{limits}"
                                       required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label" for="gapId">Процент</label>
                                <select class="form-select" id="gapId" th:field="*{gapId}" required>
                                    <option value="" disabled selected>Выберите процент</option>
                                    <option th:each="gap : ${gaps}"
                                            th:value="${gap.gapId}"
                                            th:text="${#numbers.formatDecimal(gap.gapPercent, 0, 'DEFAULT', 0, 'DEFAULT')} + ' %'">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label" for="dateScheme">Дата схемы</label>
                                <input type="date"
                                       class="form-control"
                                       id="dateScheme"
                                       th:field="*{dateScheme}">
                            </div>

                            <div class="col-12 d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ТАБЛИЦЫ: ГРУППИРОВКА ПО СХЕМАМ -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title mb-3">
                            Бонусные схемы
                            <span th:if="${dateScheme != null}"
                                  th:text="'(Дата схемы: ' + ${dateScheme} + ')'"></span>
                        </h3>


                        <div th:if="${byScheme != null and !#maps.isEmpty(byScheme)}">

                            <!-- ОДИН БЛОК ДЛЯ КАЖДОЙ СХЕМЫ (K3, K3 Эксперт, K4 и т.д.) -->
                            <div th:each="entry : ${byScheme}" class="mb-4">
                                <!-- entry.key = schemeName -->

                                <table class="table table-bordered table-sticky mb-0">
                                    <thead>
                                    <!-- Первая строка заголовка: Схема + дата схемы (общая для этой схемы) -->
                                    <tr class="table-secondary">
                                        <th colspan="2" class="text-start">
                                            <span th:text="'Схема: ' + ${entry.key}"></span>
                                        </th>
                                    </tr>
                                    <!-- Вторая строка заголовка: Позиция + Диапазоны -->
                                    <tr>
                                        <th>Позиция</th>
                                        <th>Процент</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <!-- Строки: позиции внутри этой схемы (Москва, Самара, СПб...) -->
                                    <tr th:each="schemeRow : ${entry.value}">
                                        <td th:text="${schemeRow.positionName}"></td>
                                        <td class="text-start">
                                            <div class="d-flex flex-wrap">
                                                <div th:each="cell : ${schemeRow.cells}"
                                                     class="range-chip">
                                                    <span class="percent"
                                                          th:text="${cell.gapLabel}"></span>
                                                    <span th:text="${cell.rangeValue}"></span>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div th:if="${byScheme == null or #maps.isEmpty(byScheme)}" class="text-muted">
                            Данных по бонусным схемам пока нет.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        function setNavHeight() {
            const nav = document.querySelector('.navbar');
            if (nav) {
                const navHeight = nav.offsetHeight;
                document.documentElement.style.setProperty('--nav-height', navHeight + 'px');
            }
        }

        setNavHeight();
        setTimeout(setNavHeight, 50);
        setTimeout(setNavHeight, 200);
        setTimeout(setNavHeight, 500);

        window.addEventListener('resize', setNavHeight);
    });
</script>
</body>
</html>
