<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Бонусные схемы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card + .card { margin-top: 20px; }
        .table thead th { background-color: #f8f9fa; }
        .table tbody tr:hover { background-color: #f5f5f5; }
    </style>
</head>
<body>
<div th:replace="~{navigation :: navi('BonusSchemes')}"></div>

<main class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-3">Добавить новую запись схемы</h3>
                    <form th:action="@{/bonus-schemes}" th:object="${newScheme}" method="post">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="schemeId" class="form-label">Схема</label>
                                <select id="schemeId" class="form-select" th:field="*{schemeId}">
                                    <option th:each="scheme : ${schemeNames}" th:value="${scheme.id}"
                                            th:text="${scheme.schemeName}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="positionId" class="form-label">Должность</label>
                                <select id="positionId" class="form-select" th:field="*{positionId}">
                                    <option th:each="pos : ${positions}" th:value="${pos.id}"
                                            th:text="${pos.posName}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="gapId" class="form-label">Процент</label>
                                <select id="gapId" class="form-select" th:field="*{gapId}">
                                    <option th:each="gap : ${gaps}" th:value="${gap.gapId}"
                                            th:text="${gap.gapPercent + '%'}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="limits" class="form-label">Лимит</label>
                                <input id="limits" type="number" step="0.01" class="form-control" th:field="*{limits}" required>
                            </div>
                            <div class="col-md-2">
                                <label for="dateScheme" class="form-label">Дата</label>
                                <input id="dateScheme" type="date" class="form-control" th:field="*{dateScheme}">
                            </div>
                        </div>
                        <div class="mt-3 text-end">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-3">Список схем</h3>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                            <tr>
                                <th scope="col">Название схемы</th>
                                <th scope="col">Должность</th>
                                <th scope="col">Процент</th>
                                <th scope="col">Дата</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="scheme : ${schemeRanges}">
                                <td th:text="${scheme.schemeName}"></td>
                                <td th:text="${scheme.positionName}"></td>
                                <td th:text="${scheme.percentRange}"></td>
                                <td th:text="${scheme.dateScheme}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
