<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Бонусные схемы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Уровень меню над таблицей */
        .navbar {
            z-index: 1030;
        }

        /* Отступ под фиксированное меню, как на других вкладках */
        .main-content {
            position: relative;
            padding-top: 56px; /* высота навигации */
        }

        /* Фиксируем заголовок таблицы под меню при прокрутке всей страницы */
        .table-sticky thead th {
            position: sticky;
            top: 56px;
            background: #fff;
            z-index: 1020;
            border-bottom: 2px solid #dee2e6;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        .table-bordered > :not(caption) > * > * {
            border-color: #dee2e6;
        }
    </style>
</head>
<body>
<div th:replace="~{navigation :: navi('BonusSchemes')}"></div>

<main class="main-content">
    <div class="container-fluid mt-4 px-3">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title mb-3">Бонусные схемы</h3>
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered align-middle mb-0 table-sticky">
                                <thead>
                                <tr>
                                    <th scope="col">Название схемы</th>
                                    <th scope="col">Должность</th>
                                    <th scope="col">Лимит</th>
                                    <th scope="col">Процент</th>
                                    <th scope="col">Дата</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="scheme : ${bonusSchemeView}">
                                    <td th:text="${scheme.schemeName}"></td>
                                    <td th:text="${scheme.positionName}"></td>
                                    <td th:text="${#numbers.formatDecimal(scheme.limits, 0, 'DEFAULT', 0, 'DEFAULT')}"></td>
                                    <td th:text="${#numbers.formatDecimal(scheme.gapPercent, 0, 'DEFAULT', 0, 'DEFAULT')} + ' %'"></td>
                                    <td th:text="${#dates.format(scheme.dateScheme, 'yyyy-MM-dd')}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
