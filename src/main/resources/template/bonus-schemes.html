<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Схемы бонусов</title>
    <link rel="stylesheet" th:href="@{/template/style.css}">
</head>
<body>
<div class="container" style="margin: 20px;">
    <h1>Схемы бонусов</h1>

    <section style="margin-top: 20px;">
        <h3>Добавить новую схему</h3>
        <form th:action="@{/bonus-schemes}" th:object="${newScheme}" method="post" class="form-inline">
            <label for="schemeId">ID схемы:</label>
            <input id="schemeId" type="number" th:field="*{schemeId}" required>

            <label for="positionId">Должность:</label>
            <select id="positionId" th:field="*{positionId}">
                <option th:each="pos : ${positions}" th:value="${pos.id}" th:text="${pos.posName}"></option>
            </select>

            <label for="gapId">ГЭП:</label>
            <select id="gapId" th:field="*{gapId}">
                <option th:each="gap : ${gaps}" th:value="${gap.gapId}" th:text="${gap.gapPercent + '%'}"></option>
            </select>

            <label for="limits">Лимит:</label>
            <input id="limits" type="number" step="0.01" th:field="*{limits}" required>

            <button type="submit">Сохранить</button>
        </form>
    </section>

    <section style="margin-top: 30px;">
        <h3>Текущие схемы</h3>
        <table border="1" cellpadding="6" cellspacing="0" style="width: 100%;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Схема</th>
                <th>Должность</th>
                <th>ГЭП</th>
                <th>Лимит</th>
                <th>Дата</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="scheme : ${schemes}">
                <td th:text="${scheme.id}"></td>
                <td th:text="${scheme.schemeId}"></td>
                <td th:text="${scheme.positionId}"></td>
                <td th:text="${scheme.gapId}"></td>
                <td th:text="${scheme.limits}"></td>
                <td th:text="${scheme.dateScheme}"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section style="margin-top: 30px;">
        <h3>ГЭПы</h3>
        <table border="1" cellpadding="6" cellspacing="0" style="width: 100%;">
            <thead>
            <tr>
                <th>ID</th>
                <th>%</th>
                <th>Дата</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="gap : ${gaps}">
                <td th:text="${gap.gapId}"></td>
                <td th:text="${gap.gapPercent}"></td>
                <td th:text="${gap.schemeDate}"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section style="margin-top: 30px;">
        <h3>Лимиты</h3>
        <table border="1" cellpadding="6" cellspacing="0" style="width: 100%;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Должность</th>
                <th>ГЭП</th>
                <th>Дивизион</th>
                <th>Лимит</th>
                <th>Дата</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="limit : ${limits}">
                <td th:text="${limit.id}"></td>
                <td th:text="${limit.positionId}"></td>
                <td th:text="${limit.gapId}"></td>
                <td th:text="${limit.divisionId}"></td>
                <td th:text="${limit.limits}"></td>
                <td th:text="${limit.schemeLimitsDate}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
