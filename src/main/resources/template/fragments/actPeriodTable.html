<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        /* Основной контейнер таблицы */
        .table-scroll-container {
            height: calc(100vh - 350px);
            overflow-y: auto;
            position: relative;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        /* Фиксированные заголовки */
        .fixed-header thead th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }

        /* Оптимизация отображения таблицы */
        .fixed-header {
            width: 100%;
            margin-bottom: 0;
            table-layout: auto;
        }
        .fixed-header td {
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        .fixed-header td.company-col,
        .fixed-header td.project-col {
            white-space: normal !important;
            word-break: break-word;
            overflow: visible !important;
            text-overflow: unset !important;
            max-width: 250px;
        }
        /* Фиксация заголовков таблицы именно во фрагменте */
        #periodTable thead th {
            position: sticky;
            top: 56px;
            background: white;
            z-index: 500;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div th:fragment="actPeriodTab">
    <p>Акты за период <span th:text="${date1 != null} ? ${#temporals.format(date1)}">...</span>
        <span th:text="${date2 != null} ? ${#temporals.format(date2)}">...</span></p>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label for="actOrganizationFilter" class="form-label">Фильтр по организации (От компании)</label>
            <select id="actOrganizationFilter" class="form-select">
                <option value="">Все организации</option>
            </select>
        </div>
    </div>

    <div class="table-scroll-container">
        <table id="periodTable" class="table table-bordered table-hover fixed-header" data-numeric-cols="Сумма">
            <thead class="table-light">
            <tr>
                <th>От компании</th>
                <th>Номер акта</th>
                <th>Дата акта</th>
                <th>Компания</th>
                <th>Сумма</th>
                <th>Кандидат</th>
                <th>Проект</th>
                <th>Оплата</th>
                <th>Сумма оплаты</th>
                <th>Дата оплаты</th>
                <th>Оплата до</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="act : ${actPutList}"
                th:classappend="'paid-' + ${act.paid}">
                <td th:text="${act.organization}" class="company-col"></td>
                <td th:text="${act.num}"></td>
                <td th:text="${act.date}"></td>
                <td th:text="${act.companies}"></td>
                <td th:text="${act.bonusRUB}" class="numeric"></td>
                <td th:text="${act.candidate}"></td>
                <td th:text="${act.projectName}" class="project-col"></td>
                <td>
                    <span th:switch="${act.paid}">
                        <span th:case="1" class="text-success">✓ Оплачен</span>
                        <span th:case="0" class="text-danger">✗ Не оплачен</span>
                        <span th:case="2" class="text-warning">⧖ Частично</span>
                    </span>
                </td>
                <td th:text="${act.sumPaidFor}"></td>
                <td th:text="${act.datePayment}"></td>
                <td th:text="${act.dateClientPay}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const navbarHeight = document.querySelector('.navbar').offsetHeight;
            document.querySelectorAll('.fixed-header thead th').forEach(th => {
                th.style.top = navbarHeight + 'px';
            });
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
