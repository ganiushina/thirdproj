<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Name filter fragment -->
<div th:fragment="filter-form(tableId)">
    <div class="card mb-3">
        <div class="filter-container mb-4 p-3 bg-light rounded">
            <div class="row">
                <input type="text" th:attr="data-table-id=${tableId}" id="nameFilter" placeholder="Filter by Name" th:onkeyup="nameFilter(this)" />
                <input type="text" th:attr="data-table-id=${tableId}" id="monthFilter" placeholder="Filter by Month" th:onkeyup="monthFilter(this)" />
                <input type="text" th:attr="data-table-id=${tableId}" id="departmentFilter" placeholder="Filter by department" th:onkeyup="departmentFilter(this)" />
            </div>
        </div>
    </div>
</div>

</body>
</html>
